<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>MovieHub</title>

<style>
:root {
  --bg: #08090d;
  --surface: #12141a;
  --surface-2: #171920;
  --line: rgba(255,255,255,.10);
  --text: #f4f4f6;
  --muted: #8f95a7;
  --soft: #c9cbd1;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px;
  background: rgba(8,9,13,.86);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.back-btn {
  width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.08);
  font-size: 26px; line-height: 1; cursor: pointer;
  display: grid; place-items: center; flex: 0 0 auto;
  transition: background .2s ease;
}
.back-btn:hover { background: rgba(255,255,255,.16); }
.topbar-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 26px 24px 80px; }
h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 38px); letter-spacing: -.02em; line-height: 1.1; }
.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip {
  padding: 8px 15px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255,255,255,.05);
  color: #cdd1db; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .2s ease;
}
.chip:hover { background: rgba(255,255,255,.12); }
.chip.active { background: #fff; color: #08090d; border-color: #fff; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px 14px; }

.card { display: block; cursor: pointer; }
.poster {
  position: relative; width: 100%; aspect-ratio: 2 / 3;
  border-radius: 10px; overflow: hidden;
  background: var(--surface-2); box-shadow: 0 0 0 1px var(--line);
}
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
.card:hover .poster img { transform: scale(1.04); }
.badge {
  position: absolute; left: 8px; top: 8px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(0,0,0,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  font-size: 12px; font-weight: 700; color: #ffd35a;
}
.name { margin-top: 9px; font-size: 14px; font-weight: 700; line-height: 1.3; }
.meta { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.3; }

.more { display: flex; justify-content: center; margin-top: 34px; }
.btn {
  min-height: 46px; padding: 12px 26px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.2); background: var(--surface-2);
  font-weight: 700; font-size: 14px; cursor: pointer;
  transition: background .2s ease;
}
.btn:hover { background: rgba(255,255,255,.12); }
.btn[disabled] { opacity: .6; cursor: default; }

.state { padding: 70px 0; text-align: center; color: var(--muted); font-size: 15px; }

.skel { background: linear-gradient(100deg, #12141a 30%, #1b1e27 50%, #12141a 70%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 10px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-card .poster { box-shadow: none; }
.skel-line { height: 12px; margin-top: 10px; }

@media (max-width: 700px) {
  .wrap { padding: 20px 14px 70px; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 18px 10px; }
  .name { font-size: 13px; }
  .badge { font-size: 11px; left: 6px; top: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<body>

<div class="topbar">
  <button class="back-btn" onclick="goBack()" aria-label="Back">‹</button>
  <div class="topbar-title" id="topTitle">MovieHub</div>
</div>

<main class="wrap">
  <h1 id="heading">&nbsp;</h1>
  <p class="sub" id="subheading"></p>
  <div class="chips" id="chips" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="more" id="more" hidden>
    <button class="btn" id="moreBtn" type="button">Load more</button>
  </div>
  <div class="state" id="state" hidden></div>
</main>

<script>
const IMG = "https://image.tmdb.org/t/p/";
const params = new URLSearchParams(location.search);
const id = params.get("id");
const type = params.get("type") === "tv" ? "tv" : "movie";
const kind = params.get("kind") === "cast" ? "cast" : "similar";

let items = [];
const seen = new Set();
let page = 0;
let totalPages = 1;
let loading = false;
let sortMode = "default";
let movieTitle = "";

const grid = document.getElementById("grid");
const stateEl = document.getElementById("state");
const moreWrap = document.getElementById("more");
const moreBtn = document.getElementById("moreBtn");

function esc(v) {
  return String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function goBack() {
  if (document.referrer && document.referrer.startsWith(location.origin)) { history.back(); return; }
  location.href = id ? `/movie.html?id=${encodeURIComponent(id)}&type=${type}` : "/";
}

function showSkeleton(n = 12) {
  grid.innerHTML = Array.from({ length: n }, () => `
    <div class="skel-card">
      <div class="poster skel"></div>
      <div class="skel skel-line" style="width:80%"></div>
      <div class="skel skel-line" style="width:40%"></div>
    </div>`).join("");
}

function showState(message, withRetry) {
  stateEl.hidden = false;
  stateEl.innerHTML = esc(message) + (withRetry ? `<br><button class="btn" style="margin-top:16px" onclick="location.reload()">Try again</button>` : "");
}

function year(d) { return d ? d.slice(0, 4) : ""; }

/* ---------- cards ---------- */
function titleCard(item) {
  const t = item.title || item.name || "Untitled";
  const d = item.release_date || item.first_air_date || "";
  const itemType = item.media_type || type;
  const img = item.poster_path ? `${IMG}w342${item.poster_path}` : "";
  const rating = item.vote_average ? Number(item.vote_average).toFixed(1) : "";
  return `
    <a class="card" href="/movie.html?id=${encodeURIComponent(item.id)}&type=${encodeURIComponent(itemType)}">
      <div class="poster">
        ${img ? `<img src="${img}" alt="${esc(t)}" loading="lazy">` : ""}
        ${rating ? `<span class="badge">★ ${rating}</span>` : ""}
      </div>
      <div class="name">${esc(t)}</div>
      <div class="meta">${year(d) || "&nbsp;"}</div>
    </a>`;
}

function personCard(p) {
  const img = p.profile_path ? `${IMG}w342${p.profile_path}` : "";
  return `
    <a class="card" href="/person.html?id=${encodeURIComponent(p.id)}">
      <div class="poster">${img ? `<img src="${img}" alt="${esc(p.name)}" loading="lazy">` : ""}</div>
      <div class="name">${esc(p.name)}</div>
      <div class="meta">${esc(p.character || "Cast")}</div>
    </a>`;
}

/* ---------- sorting (similar titles) ---------- */
function sortedItems() {
  const list = items.slice();
  const dateOf = x => x.release_date || x.first_air_date || "";
  if (sortMode === "newest") list.sort((a, b) => dateOf(b).localeCompare(dateOf(a)));
  if (sortMode === "rated") list.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
  return list;
}

function renderGrid() {
  grid.innerHTML = kind === "cast"
    ? items.map(personCard).join("")
    : sortedItems().map(titleCard).join("");
}

function setupChips() {
  const chips = document.getElementById("chips");
  const opts = [["default", "Popular"], ["newest", "Newest"], ["rated", "Top rated"]];
  chips.hidden = false;
  chips.innerHTML = opts.map(o => `<button type="button" class="chip${o[0] === sortMode ? " active" : ""}" data-sort="${o[0]}">${o[1]}</button>`).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    sortMode = b.dataset.sort;
    chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === b));
    renderGrid();
  });
}

/* ---------- data ---------- */
async function loadDetails() {
  const res = await fetch(`/api/${type}/${id}`);
  if (!res.ok) throw new Error("details");
  return res.json();
}

async function loadSimilarPage() {
  if (loading || page >= totalPages) return;
  loading = true;
  moreBtn.disabled = true;
  moreBtn.textContent = "Loading…";

  try {
    const next = page + 1;
    const res = await fetch(`/api/${type}/${id}/similar?page=${next}`);
    if (!res.ok) throw new Error("similar");
    const data = await res.json();

    const fresh = (data.results || []).filter(x => x && x.id && !seen.has(x.id));
    fresh.forEach(x => seen.add(x.id));
    items = items.concat(fresh);

    page = next;
    totalPages = data.total_pages || 1;

    /* if the server ignores ?page= we get no new titles: stop */
    if (!fresh.length) totalPages = page;

    renderGrid();
    if (!items.length) showState("No similar titles found.");
  } catch (_) {
    if (!items.length) showState("Couldn't load titles.", true);
    totalPages = page;
  }

  loading = false;
  moreBtn.disabled = false;
  moreBtn.textContent = "Load more";
  moreWrap.hidden = page >= totalPages;
}

async function init() {
  if (!id || id === "demo") {
    document.getElementById("heading").textContent = "Nothing to show";
    showState("Open this page from a movie's View all link.");
    return;
  }

  showSkeleton();

  try {
    const details = await loadDetails();
    movieTitle = details.title || details.name || "";
    document.title = `${kind === "cast" ? "Cast" : "More like this"} — ${movieTitle} — MovieHub`;
    document.getElementById("topTitle").textContent = movieTitle;

    if (kind === "cast") {
      document.getElementById("heading").textContent = "Cast";
      document.getElementById("subheading").textContent = movieTitle;
      items = (details.credits?.cast || []).filter(p => p && p.id);
      if (!items.length) { grid.innerHTML = ""; showState("Cast information unavailable."); return; }
      renderGrid();
      return;
    }

    document.getElementById("heading").textContent = "More like this";
    document.getElementById("subheading").textContent = `Titles similar to ${movieTitle}`;
    setupChips();
    await loadSimilarPage();

    /* auto-load when the button scrolls into view */
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && !moreWrap.hidden) loadSimilarPage();
      }, { rootMargin: "400px" }).observe(moreWrap);
    }
    moreBtn.addEventListener("click", loadSimilarPage);

  } catch (_) {
    grid.innerHTML = "";
    document.getElementById("heading").textContent = "Couldn't load";
    showState("Something went wrong while loading this list.", true);
  }
}

init();
</script>
</body>
</html>
