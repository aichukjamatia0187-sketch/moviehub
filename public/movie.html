<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Movie Details — MovieHub</title>

<style>
:root {
  --bg: #08090d;
  --surface: #12141a;
  --surface-2: #171920;
  --line: rgba(255,255,255,.10);
  --text: #f4f4f6;
  --muted: #8f95a7;
  --soft: #c9cbd1;
  --gold: #f5c451;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body { min-height: 100vh; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.page { min-height: 100vh; background: var(--bg); }

/* ---------- Top bar ---------- */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  height: calc(60px + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 18px 0;
  display: flex;
  align-items: center;
  background: linear-gradient(to bottom, rgba(0,0,0,.82), rgba(0,0,0,0));
  pointer-events: none;
  transition: background .25s ease, backdrop-filter .25s ease;
}
.topbar.scrolled {
  background: rgba(8,9,13,.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.back-btn {
  width: 42px; height: 42px;
  border: 0; border-radius: 50%;
  background: rgba(0,0,0,.55);
  font-size: 28px; line-height: 1;
  cursor: pointer;
  pointer-events: auto;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s ease, transform .2s ease;
}
.back-btn:hover { background: rgba(255,255,255,.16); }
.back-btn:active { transform: scale(.94); }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 700px;
  background: #000;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 22%;
  background: linear-gradient(to top, var(--bg), rgba(8,9,13,0));
  pointer-events: none;
  z-index: 1;
}
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(.68);
}

.hero-trailer {
  position: absolute; inset: 0;
  z-index: 2;
  display: none;
  background: #000;
  overflow: hidden;
}
.hero-trailer.active { display: block; }
.hero-trailer iframe {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  border: 0; display: block;
}

/* Invisible shield: taps never reach YouTube, so nothing can redirect */
.hero-shield {
  position: absolute; inset: 0;
  z-index: 10;
  cursor: pointer;
  background: transparent;
}

.now-playing {
  position: absolute;
  left: 18px; bottom: 22px;
  z-index: 30;
  max-width: calc(100% - 150px);
  padding: 7px 12px;
  border-radius: 8px;
  background: rgba(0,0,0,.62);
  border: 1px solid var(--line);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s ease;
}
.now-playing.show { opacity: 1; }

.hero-controls {
  position: absolute;
  right: 18px; bottom: 18px;
  z-index: 60;
  display: flex; gap: 8px;
}
.hero-control-btn {
  width: 44px; height: 44px;
  border: 1px solid rgba(255,255,255,.24);
  border-radius: 10px;
  background: rgba(0,0,0,.72);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background .2s ease, transform .2s ease;
}
.hero-control-btn:hover { background: rgba(255,255,255,.16); }
.hero-control-btn:active { transform: scale(.93); }
.hero-control-btn svg {
  width: 21px; height: 21px;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ---------- More videos (our own overlay) ---------- */
.more-videos-overlay {
  position: absolute; inset: 0;
  z-index: 40;
  display: none;
  flex-direction: column;
  justify-content: flex-end;
  padding: 16px 18px 70px;
  background: linear-gradient(to top, rgba(8,9,13,.98) 0%, rgba(8,9,13,.92) 60%, rgba(8,9,13,.45) 100%);
  cursor: pointer;
}
.more-videos-overlay.active { display: flex; }
.more-videos-overlay.ended {
  justify-content: center;
  background: rgba(8,9,13,.97);
  padding-bottom: 60px;
}

.mv-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px;
}
.more-videos-title { font-size: 15px; font-weight: 700; }
.mv-action {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 999px;
  background: rgba(255,255,255,.10);
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: background .2s ease;
}
.mv-action:hover { background: rgba(255,255,255,.2); }
.mv-action svg { width: 15px; height: 15px; fill: currentColor; }

.more-videos-row {
  display: flex; gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
  cursor: default;
}
.more-videos-row::-webkit-scrollbar { display: none; }

.more-video-card {
  flex: 0 0 150px;
  width: 150px;
  position: relative;
  cursor: pointer;
}
.more-video-thumb {
  position: relative;
  width: 150px; height: 84px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: transform .2s ease, border-color .2s ease;
}
.more-video-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.more-video-thumb .play {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.28);
}
.more-video-thumb .play span {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,.7);
  border: 1px solid rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; padding-left: 2px;
}
.more-video-card:hover .more-video-thumb { transform: translateY(-2px); border-color: rgba(255,255,255,.4); }
.more-video-name {
  margin-top: 6px;
  font-size: 11px; line-height: 1.3;
  color: #e6e8ee;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------- Custom fullscreen fallback ---------- */
.hero-trailer.custom-fullscreen {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100dvh !important;
  z-index: 99999 !important;
  display: block !important;
}
.hero-trailer:fullscreen iframe,
.hero-trailer.custom-fullscreen iframe {
  top: 50%; left: 50%; inset: auto;
  width: min(100vw, calc(100dvh * 16 / 9));
  height: min(100dvh, calc(100vw * 9 / 16));
  transform: translate(-50%, -50%);
}

/* ---------- Details ---------- */
.details-area {
  position: relative; z-index: 5;
  padding: 8px 24px 40px;
}
.details-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex; gap: 32px; align-items: flex-start;
}
.poster {
  width: 190px; height: 285px;
  flex: 0 0 190px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: -64px;
  position: relative; z-index: 6;
  background: var(--surface-2);
  box-shadow: 0 18px 44px rgba(0,0,0,.6), 0 0 0 1px var(--line);
}
.hero-info { flex: 1; min-width: 0; max-width: 820px; }

.eyebrow {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--soft);
  font-size: 12px;
  margin-bottom: 12px;
}
h1 {
  font-size: clamp(30px, 6vw, 56px);
  line-height: 1.04;
  margin: 0 0 14px;
  font-weight: 800;
  letter-spacing: -.02em;
}

.facts {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 8px; margin-bottom: 18px;
}
.fact {
  padding: 6px 11px;
  border-radius: 8px;
  background: var(--surface-2);
  color: #e1e3e8;
  font-size: 13px;
}
.fact.rating { color: #ffd35a; font-weight: 700; }

.meta-row {
  display: flex; flex-wrap: wrap; gap: 26px;
  margin-bottom: 20px;
}
.meta-block { display: flex; flex-direction: column; gap: 5px; }
.meta-label { color: var(--muted); font-size: 12px; font-weight: 600; }
.release-date { font-size: 14px; font-weight: 700; }

.my-rating-stars { display: flex; gap: 2px; margin-left: -4px; }
.my-rating-stars button {
  width: 32px; height: 32px; padding: 0;
  border: 0; background: transparent;
  color: #4a4f5d;
  font-size: 24px; line-height: 32px;
  cursor: pointer;
  transition: color .18s ease, transform .18s ease;
}
.my-rating-stars button:hover { transform: scale(1.12); }
.my-rating-stars button.active { color: var(--gold); }
.my-rating-value { min-height: 15px; color: var(--muted); font-size: 12px; }

.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.action-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 12px 20px;
  background: var(--surface-2);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 10px;
  font-weight: 700; font-size: 14px;
  cursor: pointer;
  transition: background .2s ease, border-color .2s ease, transform .2s ease;
}
.action-btn:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
.action-btn:active { transform: scale(.97); }
.action-btn.saved { background: #fff; color: #08090d; border-color: #fff; }
.action-btn svg {
  width: 18px; height: 18px;
  fill: none; stroke: currentColor; stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round;
}
.action-btn.saved .watchlist-icon { fill: currentColor; }

.overview { max-width: 760px; color: var(--soft); line-height: 1.7; font-size: 15px; margin: 0; }

/* ---------- Content ---------- */
.content { max-width: 1200px; margin: 0 auto; padding: 0 24px 100px; }
.section { margin-top: 38px; }
.section-title { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }

.genres { display: flex; flex-wrap: wrap; gap: 8px; }
.genre { padding: 8px 14px; border-radius: 999px; background: var(--surface-2); color: #cdd1db; font-size: 13px; }

.section-head-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
.section-head-row .section-title { margin: 0; }
.watch-link { color: #cfd3dc; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.watch-link:hover { color: #fff; text-decoration: underline; }
.provider-list { display: flex; flex-wrap: wrap; gap: 8px; }
.provider-chip {
  display: inline-flex; align-items: center;
  min-height: 36px; padding: 8px 14px;
  border: 1px solid #2c303a; border-radius: 8px;
  background: var(--surface); color: #d9dce4;
  font-size: 13px; font-weight: 600;
}

.people-row, .movies-row, .trailer-row {
  display: flex; gap: 12px;
  overflow-x: auto; padding-bottom: 8px;
  scrollbar-width: none;
}
.people-row::-webkit-scrollbar, .movies-row::-webkit-scrollbar, .trailer-row::-webkit-scrollbar { display: none; }

.person-card { flex: 0 0 104px; width: 104px; cursor: pointer; }
.person-photo {
  width: 104px; height: 136px; object-fit: cover;
  border-radius: 8px; background: var(--surface-2); display: block;
  transition: transform .2s ease;
}
.person-card:hover .person-photo { transform: translateY(-3px); }
.person-name { font-size: 13px; font-weight: 700; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person-role { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.movie-card { flex: 0 0 150px; cursor: pointer; }
.movie-poster {
  width: 150px; height: 225px; object-fit: cover;
  border-radius: 8px; background: var(--surface-2); display: block;
  transition: transform .2s ease;
}
.movie-card:hover .movie-poster { transform: translateY(-3px); }
.movie-title { font-size: 13px; font-weight: 700; margin-top: 8px; line-height: 1.3; }
.movie-year { color: var(--muted); font-size: 12px; margin-top: 3px; }

.trailer-card { flex: 0 0 300px; cursor: pointer; }
.trailer-thumb-wrap { position: relative; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.trailer-thumb { width: 300px; height: 169px; object-fit: cover; display: block; transition: transform .25s ease; }
.trailer-card:hover .trailer-thumb { transform: scale(1.04); }
.trailer-play {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.25);
}
.trailer-play span {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(0,0,0,.72);
  border: 1px solid rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; padding-left: 3px;
}
.trailer-title { margin-top: 9px; font-size: 14px; font-weight: 600; line-height: 1.35; }

.empty { color: var(--muted); font-size: 14px; }

/* ---------- Loading skeleton ---------- */
.loading { min-height: 100vh; display: grid; place-items: center; color: #9ba1b2; font-size: 15px; text-align: center; padding: 24px; }
.spinner {
  width: 34px; height: 34px; margin: 0 auto 14px;
  border: 3px solid rgba(255,255,255,.14);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Mobile ---------- */
@media (max-width: 700px) {
  .topbar { padding-left: 14px; padding-right: 14px; }
  .hero-controls { right: 12px; bottom: 12px; }
  .hero-control-btn { width: 40px; height: 40px; }
  .now-playing { left: 12px; bottom: 16px; max-width: calc(100% - 120px); }
  .more-videos-overlay { padding: 10px 12px 58px; }
  .more-video-card { flex-basis: 128px; width: 128px; }
  .more-video-thumb { width: 128px; height: 72px; }

  .details-area { padding: 6px 18px 30px; }
  .details-inner { flex-direction: column; gap: 14px; }
  .poster { width: 110px; height: 165px; flex-basis: auto; margin-top: -48px; }
  .content { padding: 0 18px 80px; }
  .overview { font-size: 14px; }
  .action-btn { flex: 1; }
  .person-card { flex-basis: 94px; width: 94px; }
  .person-photo { width: 94px; height: 124px; }
  .movie-card { flex-basis: 132px; }
  .movie-poster { width: 132px; height: 198px; }
  .trailer-card { flex-basis: 260px; }
  .trailer-thumb { width: 260px; height: 146px; }
}

@media (orientation: landscape) and (max-height: 600px) {
  .more-videos-overlay.ended { padding-top: 10px; padding-bottom: 50px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* =========================================================
   PRO POLISH
========================================================= */
:root { --radius: 12px; --accent: #fff; }

body { letter-spacing: .005em; }

/* top bar title */
.topbar { gap: 12px; }
.topbar-title {
  font-size: 15px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transform: translateY(4px);
  transition: opacity .25s ease, transform .25s ease;
}
.topbar.scrolled .topbar-title { opacity: 1; transform: none; }

/* ambient glow behind details */
.ambient {
  position: absolute; left: 0; right: 0; top: 0; height: 420px;
  background-size: cover; background-position: center top;
  filter: blur(70px) saturate(1.4);
  opacity: .22;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
  pointer-events: none; z-index: -1;
}

/* title block */
.eyebrow { background: rgba(255,255,255,.06); font-weight: 600; letter-spacing: .02em; }
h1 { letter-spacing: -.025em; text-wrap: balance; }
.tagline { margin: -6px 0 16px; color: var(--muted); font-size: 15px; font-style: italic; }

/* facts + score ring */
.facts { gap: 10px; }
.fact { background: rgba(255,255,255,.07); border: 1px solid var(--line); }
.score { display: inline-flex; align-items: center; gap: 9px; margin-right: 4px; }
.score-ring {
  --p: 0; --c: #3ddc84;
  position: relative;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,255,255,.14) 0);
}
.score-ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #0c0e13; }
.score-ring b { position: relative; font-size: 14px; font-weight: 800; }
.score-label { font-size: 12px; font-weight: 600; color: var(--soft); line-height: 1.2; }

/* buttons */
.action-btn { border-radius: 999px; padding: 12px 22px; }
.action-btn.primary { background: #fff; color: #08090d; border-color: #fff; }
.action-btn.primary:hover { background: #e6e8ee; }
.action-btn.primary.saved { background: var(--surface-2); color: #fff; border-color: rgba(255,255,255,.3); }
.action-btn.primary.saved:hover { background: rgba(255,255,255,.12); }

/* sections */
.section { margin-top: 44px; }
.section-title { font-size: 19px; }
.section + .section { padding-top: 0; }

/* details grid */
.info-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 1px; margin: 0;
  background: var(--line);
  border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden;
}
.info-item { background: var(--surface); padding: 14px 16px; }
.info-item dt { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 5px; }
.info-item dd { margin: 0; font-size: 14px; font-weight: 600; }

/* cards */
.person-photo, .movie-poster { box-shadow: 0 0 0 1px var(--line); border-radius: 10px; }
.movie-card, .person-card, .trailer-card { transition: transform .2s ease; }
.provider-chip { border-radius: 999px; }
.genre { border: 1px solid var(--line); background: rgba(255,255,255,.05); }

/* row arrows (desktop) */
.row-wrap { position: relative; }
.row-arrow {
  position: absolute; top: 38%; z-index: 5;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(8,9,13,.85);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 24px; line-height: 1;
  display: none; align-items: center; justify-content: center;
  cursor: pointer;
}
.row-arrow.prev { left: -12px; }
.row-arrow.next { right: -12px; }
.row-arrow:hover { background: #fff; color: #08090d; }
@media (hover: hover) and (min-width: 900px) {
  .row-wrap:hover .row-arrow { display: flex; }
}

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px);
  z-index: 5000;
  padding: 12px 20px; border-radius: 999px;
  background: #fff; color: #08090d;
  font-size: 14px; font-weight: 700;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* skeleton */
.skel { background: linear-gradient(100deg, #12141a 30%, #1b1e27 50%, #12141a 70%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 10px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-hero { width: 100%; aspect-ratio: 16 / 9; max-height: 700px; border-radius: 0; }
.skel-body { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; gap: 28px; }
.skel-poster { width: 190px; height: 285px; flex: 0 0 190px; margin-top: -64px; }
.skel-info { flex: 1; padding-top: 24px; display: flex; flex-direction: column; gap: 14px; }
.skel-line { height: 14px; }
.skel-line.big { height: 38px; }

@media (max-width: 700px) {
  .skel-body { padding: 0 18px; }
  .skel-poster { width: 110px; height: 165px; flex-basis: 110px; margin-top: -48px; }
  .topbar-title { font-size: 14px; }
  .score-ring { width: 42px; height: 42px; }
  .info-grid { grid-template-columns: repeat(2, 1fr); }
  .section { margin-top: 36px; }
}

/* =========================================================
   VIDEO FRAME + CONTROL BAR + FULLSCREEN FIX
========================================================= */
.hero-trailer { container-type: size; }

/* 16:9 stage that always fits inside the box (hero or fullscreen) */
.video-frame {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(100cqw, calc(100cqh * 16 / 9));
  height: min(100cqh, calc(100cqw * 9 / 16));
  overflow: hidden;
  background: #000;
}
/* iframe is taller than the stage: YouTube's title bar, logo and
   "More videos" strip land outside the stage and get cropped away */
.hero-trailer .video-frame iframe,
.hero-trailer:fullscreen .video-frame iframe,
.hero-trailer.custom-fullscreen .video-frame iframe {
  position: absolute !important;
  left: 0 !important; top: -30% !important;
  width: 100% !important; height: 160% !important;
  transform: none !important;
  border: 0;
}
.hero-trailer { cursor: pointer; }

.hero-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  z-index: 60;
  display: flex; align-items: center; gap: 6px;
  padding: 28px 12px calc(6px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,0));
  cursor: default;
}
.hb-btn {
  flex: 0 0 auto;
  width: 38px; height: 38px;
  border: 0; border-radius: 50%;
  background: transparent; color: #fff;
  display: grid; place-items: center;
  cursor: pointer;
  transition: background .2s ease;
}
.hb-btn:hover { background: rgba(255,255,255,.18); }
.hb-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hb-btn svg.solid { fill: currentColor; stroke: none; }
.hb-time { min-width: 34px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; color: #e6e8ee; }
.hb-seek {
  --pct: 0%;
  flex: 1; min-width: 0; height: 22px; padding: 9px 0;
  -webkit-appearance: none; appearance: none;
  background: linear-gradient(to right, #fff var(--pct), rgba(255,255,255,.3) var(--pct)) content-box;
  background-clip: content-box;
  border-radius: 2px;
  cursor: pointer;
}
.hb-seek::-webkit-slider-runnable-track { background: transparent; height: 4px; }
.hb-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.18); }
.hb-seek::-moz-range-track { background: transparent; height: 4px; }
.hb-seek::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }

.ico-exit { display: none; }
.hero-trailer:fullscreen .ico-enter, .hero-trailer.custom-fullscreen .ico-enter { display: none; }
.hero-trailer:fullscreen .ico-exit,  .hero-trailer.custom-fullscreen .ico-exit  { display: block; }

/* now playing label sits next to the back button */
.now-playing { top: 12px; bottom: auto; left: 68px; max-width: calc(100% - 90px); }
.hero-trailer:fullscreen .now-playing,
.hero-trailer.custom-fullscreen .now-playing { left: 20px; top: 18px; font-size: 13px; }

/* overlay: make room for the bar */
.more-videos-overlay { padding-bottom: 66px; }
.more-videos-overlay.ended { padding-bottom: 66px; }
.hero-trailer:fullscreen .more-videos-overlay,
.hero-trailer.custom-fullscreen .more-videos-overlay { padding: 28px 32px 76px; }
.hero-trailer:fullscreen .more-video-card,
.hero-trailer.custom-fullscreen .more-video-card { flex-basis: 190px; width: 190px; }
.hero-trailer:fullscreen .more-video-thumb,
.hero-trailer.custom-fullscreen .more-video-thumb { width: 190px; height: 107px; }
.hero-trailer:fullscreen .hero-bar,
.hero-trailer.custom-fullscreen .hero-bar { padding-left: 24px; padding-right: 24px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }

@media (max-width: 700px) {
  .hero-bar { padding: 22px 6px 2px; gap: 2px; }
  .hb-btn { width: 36px; height: 36px; }
  .hb-btn svg { width: 19px; height: 19px; }
  .hb-time { min-width: 30px; font-size: 11px; }
  .now-playing { left: 62px; top: 9px; }
  .more-videos-overlay, .more-videos-overlay.ended { padding-bottom: 52px; }
}
@media (orientation: landscape) and (max-height: 600px) {
  .hero-trailer:fullscreen .more-videos-overlay.ended { justify-content: center; }
}

/* View all */
.viewall-card { text-decoration: none; color: inherit; }
.viewall-box {
  width: 150px; height: 225px; border-radius: 10px;
  border: 1px dashed rgba(255,255,255,.28);
  background: var(--surface);
  display: grid; place-items: center;
  font-size: 30px;
  transition: background .2s ease;
}
.viewall-card:hover .viewall-box { background: var(--surface-2); }
@media (max-width: 700px) { .viewall-box { width: 132px; height: 198px; } }

/* =========================================================
   FIXES: poster no longer overlaps the video, auto-hide controls
========================================================= */
.poster { margin-top: 0 !important; }
.skel-poster { margin-top: 0 !important; }
.details-area { padding-top: 26px; }

.hero-bar, .now-playing { transition: opacity .25s ease; }
.hero-trailer.hide-ui .hero-bar { opacity: 0; pointer-events: none; }
.hero-trailer.hide-ui .now-playing { opacity: 0; }
.hero-trailer.hide-ui { cursor: none; }

.mini-progress {
  position: absolute; left: 0; bottom: 0;
  height: 3px; width: 0;
  background: #fff;
  z-index: 55;
  opacity: 0;
  transition: opacity .25s ease;
  pointer-events: none;
}
.hero-trailer.hide-ui .mini-progress { opacity: .9; }
</style>
</head>

<body>

<div id="app">
  <div class="skel-hero skel"></div>
  <div class="skel-body">
    <div class="skel skel-poster"></div>
    <div class="skel-info">
      <div class="skel skel-line" style="width:30%"></div>
      <div class="skel skel-line big" style="width:70%"></div>
      <div class="skel skel-line" style="width:45%"></div>
      <div class="skel skel-line" style="width:90%"></div>
      <div class="skel skel-line" style="width:80%"></div>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* =========================================================
   GLOBALS
========================================================= */
let heroTrailerPlayer = null;
let pendingHeroTrailerId = null;
let heroTrailerVideos = [];
let allVideos = [];
let currentHeroVideoId = null;
let heroSoundOn = false;
let overlayMode = null;       // null | "paused" | "ended"
let currentMovie = null;

const IMG = "https://image.tmdb.org/t/p/";
const params = new URLSearchParams(location.search);
const id = params.get("id") || "demo";
const type = params.get("type") === "tv" ? "tv" : "movie";

/* =========================================================
   ICONS
========================================================= */
const SOUND_ON_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15 9.5a4 4 0 0 1 0 5"></path><path d="M18 7a8 8 0 0 1 0 10"></path></svg>`;
const SOUND_OFF_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="m17 9 4 6"></path><path d="m21 9-4 6"></path></svg>`;
const HB_PLAY = `<svg class="solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>`;
const HB_PAUSE = `<svg class="solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>`;
const PLAY_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>`;
const REPLAY_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"></path></svg>`;

/* =========================================================
   HELPERS
========================================================= */
function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function poster(path, size = "w500") { return path ? IMG + size + path : ""; }
function backdrop(path) { return path ? IMG + "original" + path : ""; }
function year(date) { return date ? date.slice(0, 4) : "—"; }

function formatReleaseDate(date) {
  if (!date) return "Release date unavailable";
  const parsed = new Date(`${date}T00:00:00`);
  if (Number.isNaN(parsed.getTime())) return date;
  return parsed.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
}

function runtimeText(minutes) {
  if (!minutes) return "";
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}

function ytThumb(key) {
  return `https://img.youtube.com/vi/${encodeURIComponent(key)}/hqdefault.jpg`;
}

function videoName(key) {
  const v = allVideos.find(x => x.key === key);
  return v?.name || "Trailer";
}

/* =========================================================
   TRAILER PICKING
========================================================= */
function getTrailer(videos) {
  const list = videos?.results || [];
  return (
    list.find(v => v.site === "YouTube" && v.type === "Trailer" && v.official) ||
    list.find(v => v.site === "YouTube" && v.type === "Trailer") ||
    list.find(v => v.site === "YouTube" && v.type === "Teaser") ||
    null
  );
}

function providerData(data) {
  const results = data?.results || {};
  return results.IN || results.US || null;
}

/* =========================================================
   HERO SOUND
========================================================= */
function updateHeroSoundButton() {
  const button = document.getElementById("heroSoundButton");
  if (!button) return;
  button.innerHTML = heroSoundOn ? SOUND_ON_ICON : SOUND_OFF_ICON;
  button.setAttribute("aria-label", heroSoundOn ? "Turn sound off" : "Turn sound on");
}

function toggleHeroSound() {
  if (!heroTrailerPlayer) return;
  try {
    if (heroSoundOn) {
      heroTrailerPlayer.mute();
      heroSoundOn = false;
    } else {
      heroTrailerPlayer.unMute();
      heroTrailerPlayer.setVolume(100);
      heroSoundOn = true;
    }
  } catch (_) {}
  updateHeroSoundButton();
}

/* =========================================================
   HERO TRAILER (YouTube iframe API)
========================================================= */
function loadHeroTrailer(videoId) {
  if (!videoId) return;
  pendingHeroTrailerId = videoId;
  currentHeroVideoId = videoId;
  if (typeof YT === "undefined" || !YT.Player) return;
  createHeroTrailerPlayer(videoId);
}

function createHeroTrailerPlayer(videoId) {
  const trailerBox = document.getElementById("heroTrailer");
  const mount = document.getElementById("heroTrailerPlayer");
  if (!trailerBox || !mount || !videoId || heroTrailerPlayer) return;

  trailerBox.classList.add("active");
  setOverlay(null);

  heroTrailerPlayer = new YT.Player("heroTrailerPlayer", {
    videoId: videoId,
    playerVars: {
      autoplay: 1,
      controls: 0,
      rel: 0,
      modestbranding: 1,
      iv_load_policy: 3,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      enablejsapi: 1,
      origin: location.origin
    },
    events: {
      onReady(event) {
        try {
          event.target.mute();      // muted start allows autoplay
          event.target.playVideo();
        } catch (_) {}
        heroSoundOn = false;
        updateHeroSoundButton();
        updateNowPlaying();

        startProgressTimer();

        const iframe = event.target.getIframe();
        if (iframe) {
          iframe.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
          iframe.setAttribute("playsinline", "1");
          iframe.setAttribute("tabindex", "-1");
        }
      },

      onStateChange(event) {
        const S = YT.PlayerState;
        setPlayIcon(event.data === S.PLAYING || event.data === S.BUFFERING);

        if (event.data === S.ENDED) {
          /* stopVideo() removes YouTube's own end screen,
             so we can show OUR More Videos instead. */
          try { event.target.stopVideo(); } catch (_) {}
          setOverlay("ended");
        } else if (event.data === S.PAUSED) {
          setOverlay("paused");
        } else if (event.data === S.PLAYING) {
          setOverlay(null);
          updateNowPlaying();
        }
      },

      onError() {
        /* Video blocked or removed: try next one, else hide player */
        const next = heroTrailerVideos.find(v => v.key !== currentHeroVideoId);
        if (next && heroTrailerPlayer) {
          playInHero(next.key);
        } else {
          trailerBox.classList.remove("active");
          setOverlay(null);
        }
      }
    }
  });
}

function onYouTubeIframeAPIReady() {
  if (pendingHeroTrailerId) createHeroTrailerPlayer(pendingHeroTrailerId);
}

/* Play any YouTube key inside the hero player (never leaves the site) */
function playInHero(videoId) {
  if (!videoId) return;
  currentHeroVideoId = videoId;
  setOverlay(null);

  if (!heroTrailerPlayer) {
    loadHeroTrailer(videoId);
    return;
  }

  try {
    heroTrailerPlayer.loadVideoById(videoId);
    if (heroSoundOn) {
      heroTrailerPlayer.unMute();
      heroTrailerPlayer.setVolume(100);
    } else {
      heroTrailerPlayer.mute();
    }
  } catch (_) {}

  updateNowPlaying();
}

function updateNowPlaying() {
  const el = document.getElementById("nowPlaying");
  if (!el) return;
  el.textContent = videoName(currentHeroVideoId);
  el.classList.add("show");
  clearTimeout(updateNowPlaying.t);
  updateNowPlaying.t = setTimeout(() => el.classList.remove("show"), 3500);
}

/* Tap on the video = play / pause */
function toggleHeroPlay() {
  if (!heroTrailerPlayer) return;
  try {
    const state = heroTrailerPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
      heroTrailerPlayer.pauseVideo();
    } else if (state === YT.PlayerState.CUED || state === YT.PlayerState.ENDED) {
      playInHero(currentHeroVideoId);
    } else {
      heroTrailerPlayer.playVideo();
    }
  } catch (_) {}
}

/* =========================================================
   MORE VIDEOS (custom overlay)
========================================================= */
function prepareMoreVideos(videos) {
  allVideos = (videos || []).filter(v => v && v.site === "YouTube" && v.key);
  heroTrailerVideos = allVideos.slice(0, 12);
}

function renderMoreVideos() {
  const row = document.getElementById("moreVideosRow");
  const title = document.getElementById("moreVideosTitle");
  if (!row) return;

  const videos = heroTrailerVideos.filter(v => v.key !== currentHeroVideoId);

  if (title) title.style.display = videos.length ? "" : "none";
  row.style.display = videos.length ? "" : "none";

  row.innerHTML = videos.map(video => `
    <div class="more-video-card" data-video-id="${esc(video.key)}" role="button" tabindex="0">
      <div class="more-video-thumb">
        <img src="${ytThumb(video.key)}" alt="${esc(video.name || "Video")}" loading="lazy">
        <div class="play"><span>▶</span></div>
      </div>
      <div class="more-video-name">${esc(video.name || "Video")}</div>
    </div>
  `).join("");
}

function setOverlay(mode) {
  overlayMode = mode;
  const overlay = document.getElementById("moreVideosOverlay");
  if (!overlay) return;

  overlay.classList.remove("active", "ended", "paused");

  if (!mode) return;

  renderMoreVideos();
  overlay.classList.add("active", mode);

  const btn = document.getElementById("mvAction");
  if (btn) {
    btn.innerHTML = mode === "ended"
      ? `${REPLAY_ICON}<span>Replay</span>`
      : `${PLAY_ICON}<span>Resume</span>`;
  }
}

function resumeOrReplay() {
  if (!heroTrailerPlayer) return;
  if (overlayMode === "ended") {
    playInHero(currentHeroVideoId);
  } else {
    try { heroTrailerPlayer.playVideo(); } catch (_) {}
    setOverlay(null);
  }
}

/* Event delegation: clicks on More Videos cards play inside MovieHub */
document.addEventListener("click", function (event) {
  const card = event.target.closest(".more-video-card");
  if (card) {
    event.preventDefault();
    event.stopPropagation();
    playInHero(card.dataset.videoId);
    return;
  }

  const action = event.target.closest("#mvAction");
  if (action) {
    event.stopPropagation();
    resumeOrReplay();
    return;
  }

  /* tapping empty area of the overlay = resume */
  if (event.target.id === "moreVideosOverlay") resumeOrReplay();
});

document.addEventListener("keydown", function (event) {
  if (event.key !== "Enter" && event.key !== " ") return;
  const card = event.target.closest?.(".more-video-card");
  if (card) {
    event.preventDefault();
    playInHero(card.dataset.videoId);
  }
});

/* =========================================================
   FULLSCREEN
========================================================= */
async function openHeroFullscreen() {
  const trailerBox = document.getElementById("heroTrailer");
  if (!trailerBox) return;

  if (trailerBox.classList.contains("custom-fullscreen")) {
    trailerBox.classList.remove("custom-fullscreen");
    document.body.style.overflow = "";
    try { screen.orientation?.unlock?.(); } catch (_) {}
    return;
  }

  if (document.fullscreenElement) {
    try { await document.exitFullscreen(); } catch (_) {}
    return;
  }

  if (document.fullscreenEnabled && typeof trailerBox.requestFullscreen === "function") {
    try {
      await trailerBox.requestFullscreen({ navigationUI: "hide" });
      try { await screen.orientation?.lock?.("landscape"); } catch (_) {}
      document.body.style.overflow = "hidden";
      return;
    } catch (error) {
      console.warn("Native fullscreen unavailable:", error);
    }
  }

  trailerBox.classList.add("custom-fullscreen");
  document.body.style.overflow = "hidden";
  try { await screen.orientation?.lock?.("landscape"); } catch (_) {}
}

document.addEventListener("fullscreenchange", function () {
  const trailerBox = document.getElementById("heroTrailer");
  if (!trailerBox) return;
  if (!document.fullscreenElement) {
    trailerBox.classList.remove("custom-fullscreen");
    document.body.style.overflow = "";
    try { screen.orientation?.unlock?.(); } catch (_) {}
  }
});

document.addEventListener("keydown", function (event) {
  if (event.key !== "Escape" || document.fullscreenElement) return;
  const trailerBox = document.getElementById("heroTrailer");
  if (trailerBox?.classList.contains("custom-fullscreen")) {
    trailerBox.classList.remove("custom-fullscreen");
    document.body.style.overflow = "";
  }
});

/* =========================================================
   DATA
========================================================= */
/* =========================================================
   DEMO DATA (used when there is no ?id= or no server)
========================================================= */
function demoData() {
  const names = ["Official Trailer", "Teaser", "Behind the Scenes", "Clip 1", "Clip 2", "Featurette"];
  const keys = ["dQw4w9WgXcQ", "9bZkp7q19f0", "kJQP7kiw5Fk", "JGwWNGJdvx8", "fJ9rUzIMcZQ", "hT_nvWreIhg"];
  return {
    providers: null,
    details: {
      title: "Demo Movie (test mode)",
      release_date: "2026-01-01",
      runtime: 125, status: "Released", original_language: "en", budget: 50000000, revenue: 150000000, tagline: "Test everything before you ship.",
      vote_average: 8.1,
      overview: "Yeh sirf demo hai. Apni website par ?id=550&type=movie ke saath khologe to asli TMDB data dikhega.",
      genres: [{ name: "Drama" }, { name: "Thriller" }],
      credits: { cast: [], crew: [] },
      videos: {
        results: keys.map((k, i) => ({
          site: "YouTube", key: k, name: names[i], type: i === 0 ? "Trailer" : "Clip", official: i === 0
        }))
      }
    }
  };
}

async function getDetails() {
  if (id === "demo") return demoData();

  const base = type === "tv" ? "tv" : "movie";
  const endpoint = `/api/${base}/${id}`;
  const providerEndpoint = `/api/${base}/providers/${id}?watch_region=IN`;

  let detailsResponse, providerResponse;
  try {
    [detailsResponse, providerResponse] = await Promise.all([
      fetch(endpoint),
      fetch(providerEndpoint).catch(() => null)
    ]);
  } catch (_) {
    return demoData();   // no server reachable (e.g. preview)
  }

  if (!detailsResponse.ok) throw new Error("Unable to load details");

  const details = await detailsResponse.json();
  let providers = null;

  try {
    if (providerResponse && providerResponse.ok) {
      providers = providerData(await providerResponse.json());
    }
  } catch (_) {}

  return { details, providers };
}

async function getSimilar() {
  if (id === "demo") return [];
  try {
    const response = await fetch(type === "tv" ? `/api/tv/${id}/similar` : `/api/movie/${id}/similar`);
    if (!response.ok) return [];
    const data = await response.json();
    return data.results || [];
  } catch (_) {
    return [];
  }
}

/* =========================================================
   CREW HELPERS
========================================================= */
function getDirectors(crew) {
  if (!Array.isArray(crew)) return [];
  const out = [];
  const seen = new Set();
  for (const p of crew) {
    if (!p || !p.id) continue;
    if (String(p.job || "").toLowerCase() !== "director") continue;
    if (seen.has(String(p.id))) continue;
    seen.add(String(p.id));
    out.push(p);
  }
  return out;
}

function getWriters(crew, directorIds = []) {
  if (!Array.isArray(crew)) return [];
  const directorSet = new Set(directorIds.map(String));
  const jobs = new Set(["writer", "screenplay", "story", "teleplay", "novel"]);
  const out = [];
  const seen = new Set();
  for (const p of crew) {
    if (!p || !p.id) continue;
    const job = String(p.job || "").toLowerCase();
    if (!jobs.has(job)) continue;
    if (directorSet.has(String(p.id))) continue;
    const key = `${p.id}_${job}`;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(p);
  }
  return out;
}

/* =========================================================
   RENDER PIECES
========================================================= */
function personCard(person, role) {
  const image = person.profile_path ? poster(person.profile_path, "w185") : "";
  return `
    <div class="person-card" onclick="openPerson('${person.id}')" role="button" tabindex="0">
      ${image
        ? `<img class="person-photo" src="${image}" alt="${esc(person.name)}" loading="lazy">`
        : `<div class="person-photo"></div>`}
      <div class="person-name">${esc(person.name)}</div>
      <div class="person-role">${esc(role)}</div>
    </div>`;
}

function renderCast(cast) {
  if (!cast || !cast.length) return `<div class="empty">Cast information unavailable.</div>`;
  return cast
    .filter(p => p && p.id)
    .slice(0, 20)
    .map(p => personCard(p, p.character || "Cast"))
    .join("");
}

function renderCrew(people, emptyText, defaultRole) {
  if (!people || !people.length) return `<div class="empty">${esc(emptyText)}</div>`;
  return people
    .slice(0, 12)
    .map(p => personCard(p, p.job || p.department || defaultRole))
    .join("");
}

function renderSimilar(list) {
  if (!list.length) return `<div class="empty">More titles unavailable.</div>`;
  return list.slice(0, 12).map(item => {
    const itemType = item.media_type || type;
    const title = item.title || item.name || "Untitled";
    const date = item.release_date || item.first_air_date || "";
    return `
      <div class="movie-card" onclick="openMovie('${item.id}', '${itemType}')" role="button" tabindex="0">
        ${item.poster_path
          ? `<img class="movie-poster" src="${poster(item.poster_path)}" alt="${esc(title)}" loading="lazy">`
          : `<div class="movie-poster"></div>`}
        <div class="movie-title">${esc(title)}</div>
        <div class="movie-year">${year(date)}</div>
      </div>`;
  }).join("") + viewAllTile();
}

function renderTrailers(videos) {
  const list = (videos?.results || [])
    .filter(v => v.site === "YouTube" && v.key)
    .slice(0, 12);

  if (!list.length) return `<div class="empty">No trailers available.</div>`;

  return list.map(video => `
    <div class="trailer-card" onclick="playTrailer('${esc(video.key)}')" role="button" tabindex="0">
      <div class="trailer-thumb-wrap">
        <img class="trailer-thumb" src="${ytThumb(video.key)}" alt="${esc(video.name)}" loading="lazy">
        <div class="trailer-play"><span>▶</span></div>
      </div>
      <div class="trailer-title">${esc(video.name)}</div>
    </div>`).join("");
}

function renderProviders(providers) {
  if (!providers) return "";

  const all = [
    ...(providers.flatrate || []),
    ...(providers.free || []),
    ...(providers.ads || []),
    ...(providers.rent || []),
    ...(providers.buy || [])
  ];

  const unique = [];
  for (const item of all) {
    if (!unique.some(x => x.provider_id === item.provider_id)) unique.push(item);
  }

  if (!unique.length && !providers.link) return "";

  return `
    <section class="section">
      <div class="section-head-row">
        <h2 class="section-title">Where to watch</h2>
        ${providers.link
          ? `<a href="${esc(providers.link)}" target="_blank" rel="noopener noreferrer" class="watch-link">View all options</a>`
          : ""}
      </div>
      ${unique.length
        ? `<div class="provider-list">${unique.slice(0, 10).map(i => `<span class="provider-chip">${esc(i.provider_name)}</span>`).join("")}</div>`
        : `<div class="empty">Streaming availability unavailable.</div>`}
    </section>`;
}

/* =========================================================

========================================================= */
async function render() {

            <!-- Blocks every tap from reaching YouTube -->

            <div id="nowPlaying" class="now-playing"></div>
            <div id="miniProgress" class="mini-progress"></div>

              <div class="mv-head">
                <div id="moreVideosTitle" class="more-videos-title">More videos</div>
                <button id="mvAction" class="mv-action" type="button"></button>
              </div>
              <div id="moreVideosRow" class="more-videos-row"></div>
            </div>

            <div class="hero-bar" id="heroBar">
              <button id="heroPlayButton" class="hb-btn" type="button" onclick="toggleHeroPlay()" aria-label="Play or pause">${HB_PAUSE}</button>
              <span id="heroTime" class="hb-time">0:00</span>
              <input id="heroSeek" class="hb-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
              <span id="heroDur" class="hb-time">0:00</span>
              <button id="heroSoundButton" class="hb-btn" type="button" onclick="toggleHeroSound()" aria-label="Turn sound on">${SOUND_OFF_ICON}</button>
              <button class="hb-btn" type="button" onclick="openHeroFullscreen()" aria-label="Fullscreen">
                <svg class="ico-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5"></path><path d="M16 3h5v5"></path><path d="M8 21H3v-5"></path><path d="M16 21h5v-5"></path></svg>
                <svg class="ico-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3"></path><path d="M21 8h-5V3"></path><path d="M3 16h5v5"></path><path d="M21 16h-5v5"></path></svg>
              </button>
            </div>
          </div>
        </section>

        <section class="details-area">
          ${posterImage ? `<div class="ambient" style="background-image:url('${posterImage}')"></div>` : ""}
          <div class="details-inner">

            ${posterImage ? `<img class="poster" src="${posterImage}" alt="${esc(title)}">` : ""}

            <div class="hero-info">
              <div class="eyebrow">${type === "tv" ? "TV series" : "Movie"}</div>

              <h1>${esc(title)}</h1>
              ${details.tagline ? `<p class="tagline">${esc(details.tagline)}</p>` : ""}

              <div class="facts">
                <span class="fact">${year(date)}</span>
                ${runtime ? `<span class="fact">${runtimeText(runtime)}</span>` : ""}
                ${details.vote_average ? (() => {
                  const pct = Math.round(Number(details.vote_average) * 10);
                  const col = pct >= 70 ? "#3ddc84" : pct >= 50 ? "#f5c451" : "#ff6b6b";
                  return `<span class="score" title="User score"><span class="score-ring" style="--p:${pct};--c:${col}"><b>${pct}</b></span><span class="score-label">User score</span></span>`;
                })() : ""}
              </div>

              <div class="meta-row">
                ${date ? `
                  <div class="meta-block">
                    <span class="meta-label">Release date</span>

                <div class="meta-block">
                  <span class="meta-label">Your rating</span>
                  <div class="my-rating-stars" id="myRatingStars">
                    <button type="button" data-rating="1" aria-label="Rate 1 star">★</button>
                    <button type="button" data-rating="2" aria-label="Rate 2 stars">★</button>

            <div class="people-row">${renderCrew(directors, "Director information unavailable.", "Director")}</div>
          </section>

          <section class="section">
            <h2 class="section-title">Writers</h2>
            <div class="people-row">${renderCrew(writers, "Writer information unavailable.", "Writer")}</div>

            <h2 class="section-title">Trailers and clips</h2>

    if (trailer?.key) loadHeroTrailer(trailer.key);

  } catch (error) {
    document.getElementById("app").innerHTML = `
      <div class="loading">
        <div>
          Couldn't load this title.<br>

/* =========================================================
   NAVIGATION
========================================================= */
function openPerson(personId) {
  if (!personId) return;
  location.href = `/person.html?id=${encodeURIComponent(personId)}`;
}

function openMovie(movieId, movieType) {
  location.href = `/movie.html?id=${encodeURIComponent(movieId)}&type=${encodeURIComponent(movieType)}`;
}

function goBack() {
  if (document.referrer && document.referrer.startsWith(location.origin)) {
    history.back();
    return;
  }
  location.href = "/";
}

/* Trailers & clips row: also plays inside the hero player */
function playTrailer(key) {
  if (!key) return;
  const trailerBox = document.getElementById("heroTrailer");
  if (trailerBox) trailerBox.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
  playInHero(key);
}

window.addEventListener("scroll", function () {
  const bar = document.getElementById("topbar");
  if (bar) bar.classList.toggle("scrolled", window.scrollY > 40);
}, { passive: true });

/* =========================================================
   WATCHLIST
========================================================= */
function getWatchlist() {
  try {
    return JSON.parse(localStorage.getItem("moviehub_watchlist") || "[]");
  } catch (_) {
    return [];
  }
}

function saveWatchlist(list) {
  try {
    localStorage.setItem("moviehub_watchlist", JSON.stringify(list));
  } catch (_) {}
}

function updateWatchlistButton() {
  const button = document.getElementById("watchlistButton");
  if (!button) return;

  const text = button.querySelector(".watchlist-text");
  const saved = getWatchlist().some(item => String(item.id) === String(id) && item.type === type);

  button.classList.toggle("saved", saved);
  button.setAttribute("aria-label", saved ? "Remove from My List" : "Add to My List");
  if (text) text.textContent = saved ? "In My List" : "Add to My List";
}

function toggleWatchlist() {
  if (!document.getElementById("watchlistButton") || !id) return;

  const list = getWatchlist();
  const index = list.findIndex(item => String(item.id) === String(id) && item.type === type);

  if (index >= 0) {
    list.splice(index, 1);
    saveWatchlist(list);
    updateWatchlistButton();
    toast("Removed from My List");
    return;
  }

  list.unshift({
    id: String(id),
    type: type,
    title: currentMovie?.title || currentMovie?.name || "Untitled",
    poster: currentMovie?.poster_path ? poster(currentMovie.poster_path) : "",
    backdrop: currentMovie?.backdrop_path ? backdrop(currentMovie.backdrop_path) : "",
    addedAt: Date.now()
  });

  saveWatchlist(list);
  updateWatchlistButton();
  toast("Added to My List");
}

/* =========================================================
   SHARE
========================================================= */
async function shareMovie() {
  const title = currentMovie?.title || currentMovie?.name || "Movie";
  const shareUrl = window.location.href;
  const shareData = {
    title: `${title} — MovieHub`,
    text: `Check out ${title} on MovieHub.`,
    url: shareUrl
  };

  async function copyLink() {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      await navigator.clipboard.writeText(shareUrl);
      toast("Link copied!");
    } else {
      toast("Couldn't share. Please copy the page URL manually.");
    }
  }

  try {
    if (typeof navigator.share === "function" && (!navigator.canShare || navigator.canShare(shareData))) {
      await navigator.share(shareData);
      return;
    }
    await copyLink();
  } catch (error) {
    if (error?.name === "AbortError") return;
    try { await copyLink(); } catch (_) {
      toast("Couldn't share. Please copy the page URL manually.");
    }
  }
}

/* =========================================================
   MY RATING
========================================================= */
function setupMyRating() {
  const stars = document.querySelectorAll("#myRatingStars button");
  const value = document.getElementById("myRatingValue");
  if (!stars.length || !value || !id) return;

  const storageKey = `moviehub_rating_${type}_${id}`;
  let saved = 0;
  try { saved = Number(localStorage.getItem(storageKey) || 0); } catch (_) {}

  function applyRating(rating) {
    stars.forEach(star => {
      star.classList.toggle("active", Number(star.dataset.rating) <= rating);
    });
    value.textContent = rating ? `${rating} / 5` : "Not rated";
  }

  applyRating(saved);

  stars.forEach(star => {
    star.addEventListener("click", () => {
      const rating = Number(star.dataset.rating);
      try { localStorage.setItem(storageKey, String(rating)); } catch (_) {}
      applyRating(rating);
    });
  });
}

/* =========================================================
   START
========================================================= */

/* =========================================================
   EXTRA UI HELPERS
========================================================= */
function renderInfo(d) {
  const money = v => v ? new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(v) : null;
  let lang = null;
  try { if (d.original_language) lang = new Intl.DisplayNames(["en"], { type: "language" }).of(d.original_language); } catch (_) { lang = d.original_language; }

  const rows = [
    ["Status", d.status],
    ["Original language", lang],
    ["Budget", money(d.budget)],
    ["Revenue", money(d.revenue)],
    ["Seasons", d.number_of_seasons],
    ["Episodes", d.number_of_episodes],
    ["Network", d.networks && d.networks[0] && d.networks[0].name]
  ].filter(r => r[1]);

  if (!rows.length) return "";

  return `
    <section class="section">
      <h2 class="section-title">Details</h2>
      <dl class="info-grid">
        ${rows.map(r => `<div class="info-item"><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}
      </dl>
    </section>`;
}

let toastTimer = null;
function toast(message) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    el.setAttribute("role", "status");
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function setupRowArrows() {
  document.querySelectorAll(".people-row, .movies-row, .trailer-row").forEach(row => {
    if (row.parentElement.classList.contains("row-wrap")) return;
    const wrap = document.createElement("div");
    wrap.className = "row-wrap";
    row.parentNode.insertBefore(wrap, row);
    wrap.appendChild(row);

    ["prev", "next"].forEach(dir => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "row-arrow " + dir;
      b.setAttribute("aria-label", dir === "prev" ? "Scroll left" : "Scroll right");
      b.textContent = dir === "prev" ? "‹" : "›";
      b.onclick = () => row.scrollBy({ left: (dir === "prev" ? -1 : 1) * row.clientWidth * 0.8, behavior: "smooth" });
      wrap.appendChild(b);
    });
  });
}


/* =========================================================
   VIEW ALL
========================================================= */
function listUrl(kind) {
  return `/list.html?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&kind=${kind}`;
}

function viewAllHead(title, kind) {
  const link = id !== "demo" ? `<a class="watch-link" href="${listUrl(kind)}">View all</a>` : "";
  return `<div class="section-head-row"><h2 class="section-title">${title}</h2>${link}</div>`;
}

function viewAllTile() {
  if (id === "demo") return "";
  return `
    <a class="movie-card viewall-card" href="${listUrl("similar")}">
      <div class="viewall-box"><span>→</span></div>
      <div class="movie-title">View all</div>
    </a>`;
}

/* =========================================================
   CUSTOM CONTROL BAR
========================================================= */
let progressTimer = null;
let seeking = false;

function fmtTime(t) {
  t = Math.max(0, Math.floor(t || 0));
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

let heroPlaying = false;
let uiTimer = null;

function showUi() {
  const box = document.getElementById("heroTrailer");
  if (!box) return;
  box.classList.remove("hide-ui");
  clearTimeout(uiTimer);
  if (heroPlaying) uiTimer = setTimeout(() => box.classList.add("hide-ui"), 3000);
}

function hideUi() {
  const box = document.getElementById("heroTrailer");
  if (box && heroPlaying) box.classList.add("hide-ui");
}

function onShieldTap() {
  const box = document.getElementById("heroTrailer");
  if (!box) return;
  if (box.classList.contains("hide-ui")) showUi(); else hideUi();
}

function setPlayIcon(playing) {
  heroPlaying = playing;
  showUi();
  const btn = document.getElementById("heroPlayButton");
  if (btn) {
    btn.innerHTML = playing ? HB_PAUSE : HB_PLAY;
    btn.setAttribute("aria-label", playing ? "Pause" : "Play");
  }
}

function setSeekFill(value) {
  const mini = document.getElementById("miniProgress");
  if (mini) mini.style.width = (value / 10) + "%";
  const seek = document.getElementById("heroSeek");
  if (seek) seek.style.setProperty("--pct", (value / 10) + "%");
}

function updateProgress() {
  if (!heroTrailerPlayer || typeof heroTrailerPlayer.getCurrentTime !== "function") return;
  try {
    const d = heroTrailerPlayer.getDuration() || 0;
    const c = heroTrailerPlayer.getCurrentTime() || 0;
    const t = document.getElementById("heroTime");
    const du = document.getElementById("heroDur");
    const seek = document.getElementById("heroSeek");
    if (du) du.textContent = fmtTime(d);
    if (!seeking && d) {
      const v = Math.round((c / d) * 1000);
      if (seek) seek.value = v;
      setSeekFill(v);
      if (t) t.textContent = fmtTime(c);
    }
  } catch (_) {}
}

function startProgressTimer() {
  clearInterval(progressTimer);
  progressTimer = setInterval(updateProgress, 400);
}

function setupHeroBar() {
  const seek = document.getElementById("heroSeek");
  if (!seek) return;

  const bar = document.getElementById("heroBar");
  if (bar) bar.addEventListener("pointerdown", showUi);

  seek.addEventListener("input", () => {
    seeking = true;
    setSeekFill(Number(seek.value));
    try {
      const d = heroTrailerPlayer.getDuration() || 0;
      document.getElementById("heroTime").textContent = fmtTime(d * seek.value / 1000);
    } catch (_) {}
  });

  seek.addEventListener("change", () => {
    try {
      const d = heroTrailerPlayer.getDuration() || 0;
      heroTrailerPlayer.seekTo(d * seek.value / 1000, true);
    } catch (_) {}
    seeking = false;
  });
}

render().then(() => {
  updateWatchlistButton();
  setupMyRating();
  setupRowArrows();
  setupHeroBar();
  updateHeroSoundButton();
});
</script>
