<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta
    name="theme-color"
    content="#08090d">

  <title>Movie Details — MovieHub</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #08090d;
      color: #f4f4f6;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      background: #08090d;
    }


    /* =========================================================
       TOP BAR
    ========================================================= */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      height: 62px;

      display: flex;
      align-items: center;

      padding: 0 18px;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.82),
          rgba(0,0,0,0)
        );

      pointer-events: none;
    }

    .back-btn {
      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 50%;

      background: rgba(0,0,0,.55);

      color: #ffffff;

      font-size: 28px;

      cursor: pointer;

      pointer-events: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,.14);
      transform: scale(1.04);
    }

    .back-btn:active {
      transform: scale(.94);
    }


    /* =========================================================
       HERO
       ONLY TRAILER / BACKDROP
    ========================================================= */

    .hero {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      max-height: 700px;

      background: #000;

      overflow: hidden;
    }

    .hero-bg {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      filter: brightness(.68);

      z-index: 0;
    }


    /* =========================================================
       HERO TRAILER
    ========================================================= */

    .hero-trailer {
      position: absolute;

      inset: 0;

      z-index: 2;

      overflow: hidden;

      display: none;

      background: #000;
    }

    .hero-trailer.active {
      display: block;
    }

    /*
      IMPORTANT:
      The iframe always stays 16:9.
      It is NOT stretched to portrait fullscreen.
    */

    .hero-trailer iframe {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 100%;
      height: 100%;

      transform: translate(-50%, -50%);

      border: 0;

      display: block;
    }


    /* =========================================================
       FULLSCREEN BUTTON
    ========================================================= */

    .hero-fullscreen-btn {
      position: absolute;

      right: 18px;
      bottom: 18px;

      z-index: 20;

      width: 44px;
      height: 44px;

      border: 1px solid rgba(255,255,255,.24);

      border-radius: 8px;

      background: rgba(0,0,0,.70);

      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        background .2s ease,
        transform .2s ease,
        border-color .2s ease;
    }

    .hero-fullscreen-btn:hover {
      background: rgba(255,255,255,.15);

      border-color:
        rgba(255,255,255,.38);

      transform: scale(1.05);
    }

    .hero-fullscreen-btn:active {
      transform: scale(.93);
    }

    .hero-fullscreen-btn svg {
      width: 21px;
      height: 21px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* =========================================================
       CUSTOM FULLSCREEN MODE
       ========================================================= */

    .hero-trailer.custom-fullscreen {
      position: fixed !important;

      inset: 0 !important;

      width: 100vw !important;
      height: 100dvh !important;

      max-height: none !important;

      z-index: 99999 !important;

      background: #000 !important;

      display: block !important;
    }

    /*
      Inner 16:9 area.
      This prevents stretching on portrait phones.
    */

    .hero-trailer.custom-fullscreen::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: min(
        100vw,
        calc(100dvh * 16 / 9)
      );

      height: min(
        100dvh,
        calc(100vw * 9 / 16)
      );

      transform: translate(-50%, -50%);

      background: #000;

      z-index: 0;
    }

    .hero-trailer.custom-fullscreen iframe {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(
        100vw,
        calc(100dvh * 16 / 9)
      ) !important;

      height: min(
        100dvh,
        calc(100vw * 9 / 16)
      ) !important;

      min-width: 0 !important;
      min-height: 0 !important;

      transform: translate(-50%, -50%);

      z-index: 1;
    }

    .hero-trailer.custom-fullscreen
    .hero-fullscreen-btn {
      right: 18px;
      bottom: 18px;

      z-index: 30;
    }


    /* =========================================================
       DETAILS AREA
       ========================================================= */

    .details-area {
      position: relative;

      z-index: 5;

      background: #08090d;

      padding:
        30px
        24px
        42px;
    }

    .details-inner {
      max-width: 1200px;

      margin: 0 auto;
    }

    .hero-info {
      width: 100%;

      max-width: 900px;
    }

    .poster {
      width: 130px;
      height: 190px;

      object-fit: cover;

      border-radius: 8px;

      margin-bottom: 18px;

      box-shadow:
        0 15px 40px rgba(0,0,0,.55);
    }

    .eyebrow {
      color: #8f95a7;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 8px;
    }

    h1 {
      font-size:
        clamp(30px, 7vw, 64px);

      line-height: 1.02;

      margin: 0 0 14px;

      font-weight: 800;
    }


    /* =========================================================
       FACTS
    ========================================================= */

    .facts {
      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 9px;

      color: #e1e3e8;

      font-size: 14px;

      margin-bottom: 20px;
    }

    .facts span {
      display: inline-flex;

      align-items: center;
    }

    .rating {
      color: #ffd35a;

      font-weight: 700;
    }


    /* =========================================================
       RELEASE DATE
    ========================================================= */

    .release-box {
      display: flex;

      flex-direction: column;

      align-items: flex-start;

      gap: 3px;

      margin:
        0 0 20px;
    }

    .release-label {
      color: #8f95a7;

      font-size: 10px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 1.2px;
    }

    .release-date {
      color: #ffffff;

      font-size: 13px;

      font-weight: 700;
    }


    /* =========================================================
       MY RATING
    ========================================================= */

    .my-rating-box {
      display: inline-flex;

      flex-direction: column;

      align-items: flex-start;

      gap: 6px;

      margin:
        0 0 20px;
    }

    .my-rating-label {
      color: #8f95a7;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .my-rating-stars {
      display: flex;

      align-items: center;

      gap: 2px;
    }

    .my-rating-stars button {
      width: 30px;
      height: 30px;

      padding: 0;

      border: 0;

      background: transparent;

      color: #555a68;

      font-size: 23px;

      line-height: 30px;

      cursor: pointer;

      transition:
        color .18s ease,
        transform .18s ease;
    }

    .my-rating-stars button:hover {
      color: #f5c451;

      transform: scale(1.08);
    }

    .my-rating-stars button.active {
      color: #f5c451;
    }

    .my-rating-value {
      min-height: 14px;

      color: #8f95a7;

      font-size: 11px;

      font-weight: 600;
    }


    /* =========================================================
       ACTION BUTTONS
    ========================================================= */

    .hero-actions {
      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 10px;

      margin:
        0 0 22px;
    }

    .action-btn {
      border: 0;

      border-radius: 7px;

      padding: 13px 19px;

      font-weight: 800;

      cursor: pointer;
    }

    .watchlist-btn,
    .share-btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      min-height: 46px;

      padding: 12px 18px;

      background:
        rgba(23,25,32,.92);

      color: #ffffff;

      border:
        1px solid rgba(255,255,255,.16);

      border-radius: 7px;

      font-weight: 800;

      transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .watchlist-btn:hover,
    .share-btn:hover {
      background:
        rgba(255,255,255,.12);

      border-color:
        rgba(255,255,255,.30);

      transform:
        translateY(-1px);
    }

    .watchlist-btn:active,
    .share-btn:active {
      transform: scale(.97);
    }

    .watchlist-btn.saved {
      background:
        rgba(255,255,255,.10);

      border-color:
        rgba(255,255,255,.28);
    }

    .watchlist-icon {
      width: 18px;
      height: 18px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.8;

      stroke-linecap: round;
      stroke-linejoin: round;

      flex-shrink: 0;
    }

    .watchlist-btn.saved .watchlist-icon {
      fill: currentColor;

      stroke: currentColor;
    }

    .share-icon {
      width: 18px;
      height: 18px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;

      flex-shrink: 0;
    }


    /* =========================================================
       OVERVIEW
    ========================================================= */

    .overview {
      max-width: 820px;

      color: #c9cbd1;

      line-height: 1.65;

      font-size: 15px;

      margin: 0;
    }


    /* =========================================================
       CONTENT
    ========================================================= */

    .content {
      padding:
        0 24px
        100px;

      max-width: 1200px;

      margin: 0 auto;
    }

    .section {
      margin-top: 35px;
    }

    .section-title {
      margin:
        0 0 16px;

      font-size: 20px;

      line-height: 1.2;

      color: #ffffff;
    }

    .section-kicker {
      color: #8f95a7;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 1.8px;

      text-transform: uppercase;

      margin-bottom: 5px;
    }


    /* =========================================================
       GENRES
    ========================================================= */

    .genres {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .genre {
      padding:
        8px 12px;

      border-radius: 20px;

      background: #171920;

      color: #cdd1db;

      font-size: 13px;
    }


    /* =========================================================
       WATCH PROVIDERS
    ========================================================= */

    .watch-section .section-title {
      margin-bottom: 0;
    }

    .section-head-row {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 16px;
    }

    .watch-link {
      color: #cfd3dc;

      font-size: 12px;

      font-weight: 700;

      text-decoration: none;

      white-space: nowrap;

      padding-bottom: 4px;
    }

    .watch-link:hover {
      color: #ffffff;
    }

    .provider-list {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .provider-chip {
      display: inline-flex;

      align-items: center;

      min-height: 34px;

      padding:
        8px 13px;

      border:
        1px solid #2c303a;

      border-radius: 8px;

      background: #12141a;

      color: #d9dce4;

      font-size: 12px;

      font-weight: 600;
    }

    .provider-empty {
      color: #8f95a7;

      font-size: 13px;
    }


    /* =========================================================
       PEOPLE ROW
       ========================================================= */

    .people-row {
      display: flex;

      gap: 12px;

      overflow-x: auto;

      padding-bottom: 8px;

      scrollbar-width: none;
    }

    .people-row::-webkit-scrollbar {
      display: none;
    }

    .person-card {
      flex:
        0 0 100px;

      width: 100px;

      cursor: pointer;

      text-decoration: none;

      color: inherit;
    }

    .person-photo {
      width: 100px;
      height: 130px;

      object-fit: cover;

      border-radius: 7px;

      background: #151820;

      display: block;

      transition:
        transform .2s ease,
        opacity .2s ease;
    }

    .person-card:hover .person-photo {
      transform: translateY(-3px);

      opacity: .92;
    }

    .person-name {
      font-size: 13px;

      font-weight: 700;

      margin-top: 7px;

      line-height: 1.25;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .person-role {
      color: #8f95a7;

      font-size: 11px;

      margin-top: 3px;

      line-height: 1.25;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       MORE LIKE THIS
    ========================================================= */

    .movies-row {
      display: flex;

      gap: 12px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .movies-row::-webkit-scrollbar {
      display: none;
    }

    .movie-card {
      flex:
        0 0 145px;

      cursor: pointer;
    }

    .movie-poster {
      width: 145px;
      height: 215px;

      object-fit: cover;

      border-radius: 7px;

      background: #151820;

      display: block;
    }

    .movie-title {
      font-size: 13px;

      font-weight: 700;

      margin-top: 8px;

      line-height: 1.3;
    }

    .movie-year {
      color: #8f95a7;

      font-size: 12px;

      margin-top: 4px;
    }


    /* =========================================================
       TRAILERS
    ========================================================= */

    .trailer-row {
      display: flex;

      gap: 14px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .trailer-row::-webkit-scrollbar {
      display: none;
    }

    .trailer-card {
      flex:
        0 0 300px;

      cursor: pointer;
    }

    .trailer-thumb {
      width: 300px;
      height: 169px;

      object-fit: cover;

      border-radius: 8px;

      background: #151820;

      display: block;
    }

    .trailer-title {
      margin-top: 8px;

      font-size: 14px;

      font-weight: 700;
    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      min-height: 100vh;

      display: grid;

      place-items: center;

      color: #9ba1b2;

      font-size: 16px;
    }


    /* =========================================================
       TRAILER POPUP
    ========================================================= */

    .player {
      position: fixed;

      inset: 0;

      z-index: 3000;

      background:
        rgba(0,0,0,.96);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .player.active {
      display: flex;
    }

    .player-box {
      width:
        min(1000px, 100%);

      aspect-ratio: 16 / 9;

      position: relative;

      border-radius: 12px;

      overflow: hidden;

      background: #000;

      box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.08);
    }

    .player iframe {
      width: 100%;
      height: 100%;

      border: 0;

      border-radius: 8px;
    }

    .close-player {
      position: absolute;

      right: 12px;
      top: 12px;

      z-index: 5;

      width: 42px;
      height: 42px;

      border:
        1px solid rgba(255,255,255,.18);

      border-radius: 50%;

      background:
        rgba(0,0,0,.72);

      color: #ffffff;

      font-size: 27px;

      line-height: 1;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        background .2s ease,
        transform .2s ease,
        border-color .2s ease;
    }

    .close-player:hover {
      background:
        rgba(255,255,255,.14);

      border-color:
        rgba(255,255,255,.35);

      transform: scale(1.05);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .topbar {
        height: 56px;

        padding:
          0 14px;
      }

      .back-btn {
        width: 40px;
        height: 40px;

        font-size: 26px;
      }

      .hero {
        aspect-ratio: 16 / 9;

        max-height: none;
      }

      .hero-fullscreen-btn {
        right: 12px;
        bottom: 12px;

        width: 40px;
        height: 40px;
      }

      .hero-fullscreen-btn svg {
        width: 19px;
        height: 19px;
      }

      .details-area {
        padding:
          24px 18px 32px;
      }

      .content {
        padding:
          0 18px 80px;
      }

      h1 {
        font-size:
          clamp(30px, 9vw, 40px);

        line-height: 1.04;

        margin-bottom: 12px;
      }

      .overview {
        font-size: 14px;
      }

      .section-head-row {
        align-items: flex-start;

        flex-direction: column;

        gap: 8px;
      }

      .watch-link {
        padding-bottom: 0;
      }

      .provider-list {
        gap: 7px;
      }

      .provider-chip {
        min-height: 32px;

        padding:
          7px 11px;

        font-size: 11px;
      }

      .person-card {
        flex-basis: 92px;

        width: 92px;
      }

      .person-photo {
        width: 92px;
        height: 120px;
      }

      .person-name {
        font-size: 12px;
      }

      .person-role {
        font-size: 10px;
      }

      .movie-card {
        flex-basis: 135px;
      }

      .movie-poster {
        width: 135px;
        height: 200px;
      }

      .trailer-card {
        flex-basis: 270px;
      }

      .trailer-thumb {
        width: 270px;
        height: 152px;
      }

    }


    /* =========================================================
       LANDSCAPE MOBILE
    ========================================================= */

    @media (orientation: landscape) and (max-height: 600px) {

      .hero-trailer.custom-fullscreen iframe {
        width: 100vw !important;
        height: 100vh !important;
      }

    }

  </style>
</head>


<body>


<div id="app">

  <div class="loading">
    Loading movie...
  </div>

</div>


<!-- =========================================================
     TRAILER POPUP
========================================================= -->

<div
  id="player"
  class="player">

  <div class="player-box">

    <button
      class="close-player"
      onclick="closeTrailer()"
      aria-label="Close trailer">

      ×

    </button>

    <iframe
      id="playerFrame"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>

  </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>


/* =========================================================
   GLOBALS
========================================================= */

let heroTrailerPlayer = null;

let pendingHeroTrailerId = null;


/* =========================================================
   YOUTUBE HERO TRAILER
========================================================= */

function loadHeroTrailer(videoId) {

  if (!videoId) return;

  pendingHeroTrailerId = videoId;

  if (
    typeof YT === "undefined" ||
    !YT.Player
  ) {
    return;
  }

  createHeroTrailerPlayer(videoId);
}


function createHeroTrailerPlayer(videoId) {

  const trailerBox =
    document.getElementById(
      "heroTrailer"
    );

  const trailerPlayer =
    document.getElementById(
      "heroTrailerPlayer"
    );

  if (
    !trailerBox ||
    !trailerPlayer ||
    !videoId
  ) {
    return;
  }


  trailerBox.classList.add(
    "active"
  );


  if (heroTrailerPlayer) {

    try {
      heroTrailerPlayer.destroy();
    } catch (_) {}

    heroTrailerPlayer = null;
  }


  trailerPlayer.innerHTML = "";


  heroTrailerPlayer =
    new YT.Player(
      "heroTrailerPlayer",
      {

        videoId: videoId,

        playerVars: {

          autoplay: 1,

          controls: 0,

          rel: 0,

          playsinline: 1,

          loop: 1,

          playlist: videoId,

          fs: 1

        },


        events: {

          onReady: function(event) {

            try {

              event.target.mute();

              event.target.playVideo();

            } catch (_) {}


            const iframe =
              event.target.getIframe();


            if (iframe) {

              iframe.setAttribute(
                "allow",
                "autoplay; encrypted-media; picture-in-picture; fullscreen"
              );

              iframe.setAttribute(
                "allowfullscreen",
                ""
              );

              iframe.setAttribute(
                "playsinline",
                "1"
              );

            }

          },


          onError: function() {

            trailerBox.classList.remove(
              "active"
            );

          }

        }

      }
    );

}


function onYouTubeIframeAPIReady() {

  if (pendingHeroTrailerId) {

    createHeroTrailerPlayer(
      pendingHeroTrailerId
    );

  }

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function openHeroFullscreen() {

  const trailerBox =
    document.getElementById(
      "heroTrailer"
    );

  if (!trailerBox) return;


  /*
    If already fullscreen:
    exit fullscreen.
  */

  if (
    document.fullscreenElement
  ) {

    try {

      await document.exitFullscreen();

    } catch (_) {}

    return;
  }


  /*
    Native fullscreen first.
  */

  if (
    document.fullscreenEnabled &&
    typeof trailerBox.requestFullscreen ===
      "function"
  ) {

    try {

      await trailerBox.requestFullscreen({
        navigationUI: "hide"
      });


      /*
        Ask the browser to rotate
        to landscape when supported.

        If unsupported, the CSS keeps
        the trailer in correct 16:9
        aspect ratio with black space.
      */

      if (
        screen.orientation &&
        typeof screen.orientation.lock ===
          "function"
      ) {

        try {

          await screen.orientation.lock(
            "landscape"
          );

        } catch (_) {}

      }

      document.body.style.overflow =
        "hidden";

      return;

    } catch (error) {

      console.warn(
        "Native fullscreen unavailable:",
        error
      );

    }

  }


  /*
    CSS fullscreen fallback.
  */

  trailerBox.classList.add(
    "custom-fullscreen"
  );

  document.body.style.overflow =
    "hidden";


  if (
    screen.orientation &&
    typeof screen.orientation.lock ===
      "function"
  ) {

    try {

      await screen.orientation.lock(
        "landscape"
      );

    } catch (_) {}

  }

}

  "https://image.tmdb.org/t/p/";

/* =========================================================
   HELPERS
========================================================= */

function esc(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function poster(
  path,
  size = "w500"
) {

  return path
    ? IMG + size + path
    : "";

}


function backdrop(path) {

  return path
    ? IMG + "original" + path
    : "";

}


function year(date) {

  return date
    ? date.slice(0, 4)
    : "—";

}


function formatReleaseDate(date) {

  if (!date) {

    return "Release date unavailable";

  }


  const parsed =
    new Date(
      `${date}T00:00:00`
    );


  if (
    Number.isNaN(
      parsed.getTime()
    )
  ) {

    return date;

  }


  return parsed.toLocaleDateString(
    "en-IN",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


function runtimeText(minutes) {

  if (!minutes) return "";

  const h =
    Math.floor(
      minutes / 60
    );

  const m =
    minutes % 60;


  if (h && m) {

    return `${h}h ${m}m`;

  }


  if (h) {

    return `${h}h`;

  }


  return `${m}m`;

}


/* =========================================================
   TRAILER
========================================================= */

function getTrailer(videos) {

  const list =
    videos?.results || [];


  return (

    list.find(
      v =>
        v.site === "YouTube" &&
        v.type === "Trailer" &&
        v.official
    )

    ||

    list.find(
      v =>
        v.site === "YouTube" &&
        v.type === "Trailer"
    )

    ||

    list.find(
      v =>
        v.site === "YouTube" &&
        v.type === "Teaser"
    )

    ||

    null

  );

}


/* =========================================================
   PROVIDERS
========================================================= */

function providerData(data) {

  const results =
    data?.results || {};


  return (
    results.IN ||
    results.US ||
    null
  );

}


/* =========================================================
   DETAILS
========================================================= */

async function getDetails() {

  if (!id) {

    throw new Error(
      "Movie ID missing"
    );

  }


  const endpoint =
    type === "tv"
      ? `/api/tv/${id}`
      : `/api/movie/${id}`;


  const providerEndpoint =
    type === "tv"
      ? `/api/tv/providers/${id}?watch_region=IN`
      : `/api/movie/providers/${id}?watch_region=IN`;


  const [
    detailsResponse,
    providerResponse
  ] =
    await Promise.all([
      fetch(endpoint),
      fetch(providerEndpoint)
    ]);


  if (!detailsResponse.ok) {

    throw new Error(
      "Unable to load details"
    );

  }


  const details =
    await detailsResponse.json();


  let providers = null;


  try {

    if (providerResponse.ok) {

      const providerDataResponse =
        await providerResponse.json();

      providers =
        providerData(
          providerDataResponse
        );

    }

  } catch (_) {}


  return {
    details,
    providers
  };

}


/* =========================================================
   SIMILAR
========================================================= */

async function getSimilar() {

  try {

    const endpoint =
      type === "tv"
        ? `/api/tv/${id}/similar`
        : `/api/movie/${id}/similar`;


    const response =
      await fetch(endpoint);


    if (!response.ok) {

      return [];

    }


    const data =
      await response.json();


    return data.results || [];

  } catch (_) {

    return [];

  }

}

/* =========================================================
   DIRECTORS
========================================================= */

function getDirectors(crew) {

  if (!Array.isArray(crew)) {

    return [];

  }


  const directors = [];

  const seen = new Set();


  for (const person of crew) {

    if (
      !person ||
      !person.id
    ) {
      continue;
    }


    if (
      String(person.job || "")
        .toLowerCase() !==
      "director"
    ) {
      continue;
    }


    const key =
      String(person.id);


    if (seen.has(key)) {
      continue;
    }


    seen.add(key);

    directors.push(person);

  }


  return directors;

}


/* =========================================================
   WRITERS
   Director IDs are excluded so the same person
   doesn't appear twice.
========================================================= */

function getWriters(
  crew,
  directorIds = []
) {

  if (!Array.isArray(crew)) {

    return [];

  }


  const directorSet =
    new Set(
      directorIds.map(
        value => String(value)
      )
    );


  const writerJobs =
    new Set([
      "writer",
      "screenplay",
      "story",
      "teleplay",
      "novel"
    ]);


  const writers = [];

  const seen = new Set();


  for (const person of crew) {

    if (
      !person ||
      !person.id
    ) {
      continue;
    }


    const job =
      String(
        person.job || ""
      ).toLowerCase();


    if (
      !writerJobs.has(job)
    ) {
      continue;
    }


    /*
      Do not duplicate the director
      inside Writers.
    */

    if (
      directorSet.has(
        String(person.id)
      )
    ) {
      continue;
    }


    const key =
      `${person.id}_${job}`;


    if (seen.has(key)) {
      continue;
    }


    seen.add(key);

    writers.push(person);

  }


  return writers;

}

/* =========================================================
   PROVIDERS
========================================================= */

function renderProviders(providers) {

  if (!providers) {

    return "";

  }


  const all = [

    ...(providers.flatrate || []),

    ...(providers.free || []),

    ...(providers.ads || []),

    ...(providers.rent || []),

    ...(providers.buy || [])

  ];


  const unique = [];


  for (const item of all) {

    if (
      !unique.some(
        x =>
          x.provider_id ===
          item.provider_id
      )
    ) {

      unique.push(item);

    }

  }


  if (
    !unique.length &&
    !providers.link
  ) {

    return "";

  }


  return `

    <section
      class="section watch-section">

      <div class="section-head-row">

        <div>

          <div class="section-kicker">
            STREAMING
          </div>

          <h2 class="section-title">

        ${
          providers.link

            ? `

                  providers.link

                target="_blank"
                rel="noopener noreferrer"
                class="watch-link">

                View availability →

              </a>

            `

            : ""

        }

      </div>


      ${
        unique.length

          ? `

            <div
              class="provider-list">

              ${

                unique

                  .slice(0, 10)

                  .map(
                    item => `

                      <span
                        class="provider-chip">

                        ${esc(
                          item.provider_name
                        )}

                      </span>

                    `
                  )

                  .join("")

              }

            </div>

          `

          : `

            <div
              class="provider-empty">

              Streaming availability unavailable.

            </div>

          `
      }

    </section>

  `;

}

            </div>


          </section>


        </main>


      </div>

    `;


    /* =====================================================
       START HERO TRAILER
    ===================================================== */

    if (trailer?.key) {

      loadHeroTrailer(
        trailer.key
      );

    }


  } catch (error) {


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="loading">

        Unable to load movie details.

      </div>

    `;


    console.error(error);

  }

}


/* =========================================================
   WATCHLIST
========================================================= */

function getWatchlist() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "moviehub_watchlist"
      ) || "[]"
    );

  } catch (_) {

    return [];

  }

}


function saveWatchlist(list) {

  localStorage.setItem(
    "moviehub_watchlist",
    JSON.stringify(list)
  );

}


function updateWatchlistButton() {

  const button =
    document.getElementById(
      "watchlistButton"
    );


  if (!button) return;


  const text =
    button.querySelector(
      ".watchlist-text"
    );


  const watchlist =
    getWatchlist();


  const saved =
    watchlist.some(
      item =>
        String(item.id) ===
          String(id) &&
        item.type === type
    );


  if (saved) {

    button.classList.add(
      "saved"
    );


    button.setAttribute(
      "aria-label",
      "Remove from Watchlist"
    );


    if (text) {

      text.textContent =
        "MY LIST";

    }

  } else {

    button.classList.remove(
      "saved"
    );


    button.setAttribute(
      "aria-label",
      "Add to Watchlist"
    );


    if (text) {

      text.textContent =
        "MY LIST";

    }

  }

}


function toggleWatchlist() {

  const button =
    document.getElementById(
      "watchlistButton"
    );


  if (
    !button ||
    !id
  ) {
    return;
  }


  const list =
    getWatchlist();


  const existingIndex =
    list.findIndex(
      item =>
        String(item.id) ===
          String(id) &&
        item.type === type
    );


  if (
    existingIndex >= 0
  ) {

    list.splice(
      existingIndex,
      1
    );


    saveWatchlist(list);

    updateWatchlistButton();

    return;

  }


  const title =
    document.querySelector(
      "h1"
    )?.textContent.trim() ||
    "Untitled";


  const posterElement =
    document.querySelector(
      ".poster"
    );


  const item = {

    id: String(id),

    type: type,

    title: title,

    poster:
      posterElement?.getAttribute(
        "src"
      ) || "",

    backdrop:
      backdrop(
        document.body.dataset.backdrop
      ),

    addedAt:
      Date.now()

  };


  list.unshift(item);


  saveWatchlist(list);


  updateWatchlistButton();

}


/* =========================================================
   SHARE
========================================================= */

async function shareMovie() {

  const title =
    document.querySelector(
      "h1"
    )?.textContent.trim() ||
    "Movie";


  const shareUrl =
    window.location.href;


  const shareData = {

    title:
      `${title} — MovieHub`,

    text:
      `Check out ${title} on MovieHub.`,

    url:
      shareUrl

  };


  try {


    if (

      typeof navigator.share ===
        "function" &&

      (
        !navigator.canShare ||
        navigator.canShare(
          shareData
        )
      )

    ) {


      await navigator.share(
        shareData
      );


      return;

    }


    if (

      navigator.clipboard &&

      typeof navigator.clipboard.writeText ===
        "function"

    ) {


      await navigator.clipboard.writeText(
        shareUrl
      );


      alert(
        "Movie link copied!"
      );


      return;

    }


    alert(
      "Unable to share. Please copy the page URL manually."
    );


  } catch (error) {


    if (
      error?.name ===
      "AbortError"
    ) {

      return;

    }


    console.error(
      "Share failed:",
      error
    );


    try {


      if (

        navigator.clipboard &&

        typeof navigator.clipboard.writeText ===
          "function"

      ) {


        await navigator.clipboard.writeText(
          shareUrl
        );


        alert(
          "Movie link copied!"
        );


      } else {


        alert(
          "Unable to share. Please copy the page URL manually."
        );


      }


    } catch (_) {


      alert(
        "Unable to share. Please copy the page URL manually."
      );


    }

  }

}


/* =========================================================
   OPEN MOVIE
========================================================= */

function openMovie(
  movieId,
  movieType
) {

  location.href =
    `/movie.html?id=${encodeURIComponent(
      movieId
    )}&type=${encodeURIComponent(
      movieType
    )}`;

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

  if (
    document.referrer &&
    document.referrer.startsWith(
      location.origin
    )
  ) {

    history.back();

    return;

  }


  location.href = "/";

}


/* =========================================================
   TRAILER POPUP
========================================================= */

function playTrailer(key) {

  if (!key) return;


  const player =
    document.getElementById(
      "player"
    );


  const frame =
    document.getElementById(
      "playerFrame"
    );


  frame.src =
    `https://www.youtube.com/embed/${encodeURIComponent(
      key
    )}?autoplay=1&rel=0&playsinline=1&fs=1`;


  player.classList.add(
    "active"
  );

}


function closeTrailer() {

  const player =
    document.getElementById(
      "player"
    );


  const frame =
    document.getElementById(
      "playerFrame"
    );


  frame.src = "";


  player.classList.remove(
    "active"
  );

}


/* =========================================================
   MY RATING
========================================================= */

function setupMyRating() {

  const stars =
    document.querySelectorAll(
      "#myRatingStars button"
    );


  const value =
    document.getElementById(
      "myRatingValue"
    );


  if (
    !stars.length ||
    !value ||
    !id
  ) {
    return;
  }


  const storageKey =
    `moviehub_rating_${type}_${id}`;


  const savedRating =
    Number(
      localStorage.getItem(
        storageKey
      ) || 0
    );


  function applyRating(
    rating
  ) {


    stars.forEach(
      star => {

        const starRating =
          Number(
            star.dataset.rating
          );


        star.classList.toggle(
          "active",
          starRating <= rating
        );

      }
    );


    value.textContent =
      rating

        ? `${rating} / 5`

        : "Rate this title";

  }


  applyRating(
    savedRating
  );


  stars.forEach(
    star => {


      star.addEventListener(
        "click",
        () => {


          const rating =
            Number(
              star.dataset.rating
            );


          localStorage.setItem(
            storageKey,
            String(rating)
          );


          applyRating(
            rating
          );


        }
      );


    }
  );

}


/* =========================================================
   START
========================================================= */

render().then(
  () => {

    updateWatchlistButton();

    setupMyRating();

  }
);


</script>
