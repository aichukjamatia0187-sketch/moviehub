<div id="app">

<div id="player" class="player">
  <div class="player-box">
    <button class="close-player" onclick="closeTrailer()">×</button>
    <iframe
  id="playerFrame"
  allow="autoplay; encrypted-media; picture-in-picture; fullscreen"

</iframe>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let heroTrailerPlayer = null;
let pendingHeroTrailerId = null;


function loadHeroTrailer(videoId) {

  if (!videoId) return;

  pendingHeroTrailerId = videoId;

  if (typeof YT === "undefined" || !YT.Player) {
    return;
  }

  createHeroTrailerPlayer(videoId);
}

function createHeroTrailerPlayer(videoId) {

  const trailerBox =
    document.getElementById("heroTrailer");

  const trailerPlayer =
    document.getElementById("heroTrailerPlayer");

  if (!trailerBox || !trailerPlayer || !videoId) {
    return;
  }

  trailerBox.classList.add("active");

  if (heroTrailerPlayer) {
    heroTrailerPlayer.destroy();
    heroTrailerPlayer = null;
  }

  trailerPlayer.innerHTML = "";

  heroTrailerPlayer =
    new YT.Player("heroTrailerPlayer", {

      videoId: videoId,

playerVars: {
  autoplay: 1,
  controls: 0,
  rel: 0,
  playsinline: 1,
  loop: 1,
  playlist: videoId,
  fs: 1,
  modestbranding: 1
},

      events: {

        onReady: function(event) {

  event.target.mute();

  event.target.playVideo();

},
        onError: function() {

          trailerBox.classList.remove("active");

        }

      }

    });

}

function onYouTubeIframeAPIReady() {

  if (pendingHeroTrailerId) {

    createHeroTrailerPlayer(
      pendingHeroTrailerId
    );

  }

}
function openHeroFullscreen() {

  if (
    !heroTrailerPlayer ||
    typeof heroTrailerPlayer.getIframe !== "function"
  ) {
    return;
  }

  const iframe =
    heroTrailerPlayer.getIframe();

  if (!iframe) return;

  if (iframe.requestFullscreen) {

    iframe.requestFullscreen();

  } else if (iframe.webkitRequestFullscreen) {

    iframe.webkitRequestFullscreen();

  } else {

    iframe.focus();

  }

}
  document.addEventListener("click", function () {

  if (
    heroTrailerPlayer &&
    typeof heroTrailerPlayer.unMute === "function"
  ) {

    heroTrailerPlayer.unMute();
    heroTrailerPlayer.setVolume(100);

  }

}, { once: true });
  const IMG = "https://image.tmdb.org/t/p/";

const params = new URLSearchParams(location.search);

const id = params.get("id");
const type = params.get("type") === "tv" ? "tv" : "movie";

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function poster(path, size = "w500") {
  return path
    ? IMG + size + path
    : "";
}

function backdrop(path) {
  return path
    ? IMG + "original" + path
    : "";
}

function year(date) {
  return date
    ? date.slice(0, 4)
    : "—";
}
function formatReleaseDate(date) {

  if (!date) {
    return "Release date unavailable";
  }

  const parsed = new Date(`${date}T00:00:00`);

  if (Number.isNaN(parsed.getTime())) {
    return date;
  }

  return parsed.toLocaleDateString("en-IN", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}
function runtimeText(minutes) {

  if (!minutes) return "";

  const h = Math.floor(minutes / 60);
  const m = minutes % 60;

  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;

  return `${m}m`;
}

function getTrailer(videos) {

  const list = videos?.results || [];

  return (
    list.find(v =>
      v.site === "YouTube" &&
      v.type === "Trailer" &&
      v.official
    ) ||
    list.find(v =>
      v.site === "YouTube" &&
      v.type === "Trailer"
    ) ||
    list.find(v =>
      v.site === "YouTube" &&
      v.type === "Teaser"
    ) ||
    null
  );
}

function providerData(data) {

  const results = data?.results || {};

  return results.IN || results.US || null;
}

async function getDetails() {

  if (!id) {
    throw new Error("Movie ID missing");
  }

  const endpoint =
    type === "tv"
      ? `/api/tv/${id}`
      : `/api/movie/${id}`;

  const providerEndpoint =
    type === "tv"
      ? `/api/tv/providers/${id}?watch_region=IN`
      : `/api/movie/providers/${id}?watch_region=IN`;

  const [detailsResponse, providerResponse] =
    await Promise.all([
      fetch(endpoint),
      fetch(providerEndpoint)
    ]);

  const details = await detailsResponse.json();

  let providers = null;

  try {
    const providerDataResponse =
      await providerResponse.json();

    providers = providerData(providerDataResponse);
  } catch (_) {}

  return {
    details,
    providers
  };
}

async function getSimilar() {

  try {

    const endpoint =
      type === "tv"
        ? `/api/tv/${id}/similar`
        : `/api/movie/${id}/similar`;

    const response = await fetch(endpoint);

    if (!response.ok) return [];

    const data = await response.json();

    return data.results || [];

  } catch (_) {

    return [];

  }
}

function renderCast(cast) {

  if (!cast || !cast.length) {

    return `
      <div style="color:#8f95a7">
        Cast information unavailable.
      </div>
    `;

  }

  return cast
    .slice(0, 12)
    .map(person => {

      const image = person.profile_path
        ? poster(person.profile_path, "w185")
        : "";

      return `
        <div
          class="cast-card"
          data-person-id="${person.id}"
          onclick="openPerson('${person.id}')"
          style="cursor:pointer;"
        >

          ${
            image
              ? `<img
                   class="cast-photo"
                   src="${image}"
                   alt="${esc(person.name)}">`
              : `<div class="cast-photo"></div>`
          }

          <div class="cast-name">
            ${esc(person.name)}
          </div>

          <div class="cast-character">
            ${esc(person.character || "")}
          </div>

        </div>
      `;

    })
    .join("");
}

function openPerson(personId) {

  if (!personId) return;

  location.href =
    `/person.html?id=${encodeURIComponent(personId)}`;

}

function renderSimilar(list) {

  if (!list.length) {

    return `
      <div style="color:#8f95a7">
        More movies unavailable.
      </div>
    `;

  }

  return list
    .slice(0, 12)
    .map(item => {

      const itemType =
        item.media_type ||
        type;

      const title =
        item.title ||
        item.name ||
        "Untitled";

      const date =
        item.release_date ||
        item.first_air_date ||
        "";

      return `
        <div
          class="movie-card"
          onclick="openMovie('${item.id}','${itemType}')"
        >

          ${
            item.poster_path
              ? `
                <img
                  class="movie-poster"
                  src="${poster(item.poster_path)}"
                  alt="${esc(title)}">
              `
              : `
                <div class="movie-poster"></div>
              `
          }

          <div class="movie-title">
            ${esc(title)}
          </div>

          <div class="movie-year">
            ${year(date)}
          </div>

        </div>
      `;

    })
    .join("");
}

function renderTrailers(videos) {

  const list = (videos?.results || [])
    .filter(v => v.site === "YouTube")
    .slice(0, 8);

  if (!list.length) {

    return `
      <div style="color:#8f95a7">
        No trailers available.
      </div>
    `;

  }

  return list
    .map(video => {

      return `
        <div
          class="trailer-card"
          onclick="playTrailer('${esc(video.key)}')"
        >

          <img
            class="trailer-thumb"
            src="https://img.youtube.com/vi/${encodeURIComponent(video.key)}/hqdefault.jpg"
            alt="${esc(video.name)}">

          <div class="trailer-title">
            ${esc(video.name)}
          </div>

        </div>
      `;

    })
    .join("");
}

function renderProviders(providers) {

  if (!providers) return "";

  const all = [
    ...(providers.flatrate || []),
    ...(providers.free || []),
    ...(providers.ads || []),
    ...(providers.rent || []),
    ...(providers.buy || [])
  ];

  const unique = [];

  for (const item of all) {

    if (
      !unique.some(
        x => x.provider_id === item.provider_id
      )
    ) {
      unique.push(item);
    }

  }

  if (!unique.length && !providers.link) {
    return "";
  }

  return `
    <section class="section watch-section">

      <div class="section-head-row">

        <div>
          <div class="section-kicker">
            STREAMING
          </div>

          <h2 class="section-title">
            Watch Here
          </h2>
        </div>

        ${
          providers.link
            ? `
              <a
                href="${esc(providers.link)}"
                target="_blank"
                rel="noopener noreferrer"
                class="watch-link">
                View availability →
              </a>
            `
            : ""
        }

      </div>

      ${
        unique.length
          ? `
            <div class="provider-list">

              ${
                unique
                  .slice(0, 10)
                  .map(item => `
                    <span class="provider-chip">
                      ${esc(item.provider_name)}
                    </span>
                  `)
                  .join("")
              }

            </div>
          `
          : `
            <div class="provider-empty">
              Streaming availability unavailable.
            </div>
          `
      }

    </section>
  `;
}

function updateWatchlistButton() {

  const button =
    document.getElementById("watchlistButton");

  if (!button) return;

  const text =
    button.querySelector(".watchlist-text");

  const watchlist =
    JSON.parse(
      localStorage.getItem("moviehub_watchlist") || "[]"
    );

  const saved =
    watchlist.some(
      item =>
        String(item.id) === String(id) &&
        item.type === type
    );

  if (saved) {

    button.classList.add("saved");

    button.setAttribute(
      "aria-label",
      "Remove from Watchlist"
    );

    if (text) {
      text.textContent = "MY LIST";
    }

  } else {

    button.classList.remove("saved");

    button.setAttribute(
      "aria-label",
      "Add to Watchlist"
    );

    if (text) {
      text.textContent = "MY LIST";
    }

  }

}
function openMovie(movieId, movieType) {

  location.href =
    `/movie.html?id=${encodeURIComponent(movieId)}&type=${encodeURIComponent(movieType)}`;
}



 function getWatchlist() {
  try {
    return JSON.parse(
      localStorage.getItem("moviehub_watchlist") || "[]"
    );
  } catch (_) {
    return [];
  }
}

function saveWatchlist(list) {
  localStorage.setItem(
    "moviehub_watchlist",
    JSON.stringify(list)
  );
}

function toggleWatchlist() {

  const button =
    document.getElementById("watchlistButton");

  if (!button || !id) return;

  const list = getWatchlist();

  const existingIndex =
    list.findIndex(
      item =>
        String(item.id) === String(id) &&
        item.type === type
    );

  if (existingIndex >= 0) {

    list.splice(existingIndex, 1);

    saveWatchlist(list);

    updateWatchlistButton();

    return;
  }

  const title =
    document.querySelector("h1")?.textContent.trim() ||
    "Untitled";

  const posterElement =
    document.querySelector(".poster");

  const backdropElement =
    document.querySelector(".hero-bg");

  const item = {
    id: String(id),
    type: type,
    title: title,
    poster: posterElement?.getAttribute("src") || "",
    backdrop: backdropElement?.style.backgroundImage || "",
    addedAt: Date.now()
  };

  list.unshift(item);

  saveWatchlist(list);

  updateWatchlistButton();
}

  async function shareMovie() {

  const title =
    document.querySelector("h1")?.textContent.trim() ||
    "Movie";

  const shareUrl =
    window.location.href;

  const shareData = {
    title: `${title} — MovieHub`,
    text: `Check out ${title} on MovieHub.`,
    url: shareUrl
  };

  try {

    if (
      typeof navigator.share === "function" &&
      (!navigator.canShare ||
        navigator.canShare(shareData))
    ) {

      await navigator.share(shareData);

      return;
    }

    if (
      navigator.clipboard &&
      typeof navigator.clipboard.writeText === "function"
    ) {

      await navigator.clipboard.writeText(
        shareUrl
      );

      alert("Movie link copied!");

      return;
    }

    alert(
      "Unable to share. Please copy the page URL manually."
    );
    
  } catch (error) {

    if (error?.name === "AbortError") {
      return;
    }

    console.error(
      "Share failed:",
      error
    );

    try {

      if (
        navigator.clipboard &&
        typeof navigator.clipboard.writeText === "function"
      ) {

        await navigator.clipboard.writeText(
          shareUrl
        );

        alert("Movie link copied!");

      } else {

        alert(
          "Unable to share. Please copy the page URL manually."
        );

      }

    } catch (_) {

      alert(
        "Unable to share. Please copy the page URL manually."
      );

    }

  }

}

function goBack() {
  location.href = "/";
}

function playTrailer(key) {

  if (!key) return;

  const player =
    document.getElementById("player");

  const frame =
    document.getElementById("playerFrame");

  frame.src =
    `https://www.youtube.com/embed/${encodeURIComponent(key)}?autoplay=1&rel=0`;

  player.classList.add("active");

}

function closeTrailer() {

  const player =
    document.getElementById("player");

  const frame =
    document.getElementById("playerFrame");

  frame.src = "";

  player.classList.remove("active");

}
render().then(() => {
  updateWatchlistButton();
  setupMyRating();
});
function setupMyRating() {

  const stars =
    document.querySelectorAll("#myRatingStars button");

  const value =
    document.getElementById("myRatingValue");

  if (!stars.length || !value || !id) return;

  const storageKey =
    `moviehub_rating_${type}_${id}`;

  const savedRating =
    Number(localStorage.getItem(storageKey) || 0);

  function applyRating(rating) {

    stars.forEach(star => {

      const starRating =
        Number(star.dataset.rating);

      star.classList.toggle(
        "active",
        starRating <= rating
      );

    });

    value.textContent =
      rating
        ? `${rating} / 5`
        : "Rate this title";
  }

  applyRating(savedRating);

  stars.forEach(star => {

    star.addEventListener("click", () => {

      const rating =
        Number(star.dataset.rating);

      localStorage.setItem(
        storageKey,
        String(rating)
      );

      applyRating(rating);

    });

  });

}
