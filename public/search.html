<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Search — MovieHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #08090d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      padding: 22px 24px 70px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 50px;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
    }

    .back {
      color: #9da1ad;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #fff;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 45px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #30323a;
      border-radius: 5px;
      outline: none;
      background: #11131a;
      color: #fff;
      font-size: 14px;
    }

    .search-input:focus {
      border-color: #666b78;
    }

    .search-button {
      height: 48px;
      padding: 0 22px;
      border: 1px solid #30323a;
      border-radius: 5px;
      background: #fff;
      color: #08090d;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .search-button:hover {
      opacity: .88;
    }

    .heading {
      margin-bottom: 28px;
    }

    .eyebrow {
      color: #777d8b;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: -1.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 24px 14px;
    }

    .card {
      cursor: pointer;
      min-width: 0;
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      border-radius: 5px;
      background: #151820;
      transition: transform .2s ease, opacity .2s ease;
    }

    .card:hover .poster {
      transform: translateY(-4px);
      opacity: .9;
    }

    .title {
      margin-top: 9px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 5px;
      color: #777d8b;
      font-size: 11px;
    }

    .rating {
      color: #c9a85d;
      margin-left: 7px;
    }

    .type {
      margin-left: 7px;
      color: #8c91a0;
    }

    .message {
      min-height: 300px;
      display: grid;
      place-items: center;
      color: #777d8b;
      font-size: 13px;
      text-align: center;
    }

    .load-more {
      display: block;
      margin: 50px auto 0;
      padding: 13px 24px;
      background: transparent;
      color: #ddd;
      border: 1px solid #30323a;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .load-more:hover {
      border-color: #777;
    }

    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px 10px;
      }
    }

    @media (max-width: 600px) {

      .page {
        padding: 20px 14px 60px;
      }

      .topbar {
        margin-bottom: 40px;
      }

      .search-box {
        margin-bottom: 35px;
      }

      .search-button {
        padding: 0 16px;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px 9px;
      }

      .title {
        font-size: 12px;
      }

      .meta {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="container">

      <header class="topbar">
        <a class="logo" href="/">MovieHub</a>

        <a class="back" href="/">
          ← Back
        </a>
      </header>


      <div class="search-box">

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search movies or TV shows..."
          autocomplete="off"
        >

        <button
          id="searchButton"
          class="search-button"
        >
          SEARCH
        </button>

      </div>


      <section class="heading">

        <div class="eyebrow">
          MovieHub Search
        </div>

        <h1 id="heading">
          Search
        </h1>

      </section>


      <div
        id="results"
        class="grid"
      >
        <div class="message">
          Search for a movie or TV show.
        </div>
      </div>


      <button
        id="loadMore"
        class="load-more"
        style="display:none"
      >
        LOAD MORE
      </button>

    </div>

  </div>


<script>

  const IMG =
    "https://image.tmdb.org/t/p/";


  const input =
    document.getElementById("searchInput");

  const button =
    document.getElementById("searchButton");

  const results =
    document.getElementById("results");

  const heading =
    document.getElementById("heading");

  const loadMore =
    document.getElementById("loadMore");


  let currentQuery = "";

  let currentPage = 1;

  let totalPages = 1;


  function esc(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function poster(path) {

    return path
      ? IMG + "w500" + path
      : "";

  }


  function year(item) {

    const date =
      item.release_date ||
      item.first_air_date ||
      "";

    return date
      ? date.slice(0, 4)
      : "—";

  }


  function card(item) {

    const isTV =
      Boolean(item.name);


    const title =
      item.title ||
      item.name ||
      "Untitled";


    const type =
      isTV
        ? "TV"
        : "Movie";


    return `

      <article
        class="card"
        onclick="openItem(${item.id}, '${isTV ? "tv" : "movie"}')"
      >

        ${
          item.poster_path

            ? `

              <img
                class="poster"
                src="${poster(item.poster_path)}"
                alt="${esc(title)}"
                loading="lazy"
              >

            `

            : `

              <div class="poster"></div>

            `
        }


        <div class="title">
          ${esc(title)}
        </div>


        <div class="meta">

          ${year(item)}

          ${
            item.vote_average

              ? `

                <span class="rating">
                  ★ ${Number(item.vote_average).toFixed(1)}
                </span>

              `

              : ""
          }


          <span class="type">
            ${type}
          </span>

        </div>

      </article>

    `;

  }


  async function search(page = 1) {

    const query =
      input.value.trim();


    if (!query) {

      results.innerHTML = `
        <div class="message">
          Please enter a movie or TV show name.
        </div>
      `;

      loadMore.style.display =
        "none";

      return;

    }


    currentQuery =
      query;


    if (page === 1) {

      results.innerHTML = `
        <div class="message">
          Searching...
        </div>
      `;

    }


    try {

      const movieURL =
        `/api/search/movie?query=${encodeURIComponent(query)}&page=${page}`;


      const tvURL =
        `/api/search/tv?query=${encodeURIComponent(query)}&page=${page}`;


      const [movieResponse, tvResponse] =
        await Promise.all([
          fetch(movieURL),
          fetch(tvURL)
        ]);


      if (
        !movieResponse.ok ||
        !tvResponse.ok
      ) {
        throw new Error(
          "Search request failed."
        );
      }


      const movieData =
        await movieResponse.json();


      const tvData =
        await tvResponse.json();


      const movies =
        (movieData.results || [])
          .filter(item => item.poster_path)
          .map(item => ({
            ...item,
            _type: "movie"
          }));


      const shows =
        (tvData.results || [])
          .filter(item => item.poster_path)
          .map(item => ({
            ...item,
            _type: "tv"
          }));


      const combined = [
        ...movies,
        ...shows
      ];


      const unique =
        Array.from(
          new Map(
            combined.map(
              item => [
                `${item._type}-${item.id}`,
                item
              ]
            )
          ).values()
        );


      if (page === 1) {

        results.innerHTML = "";

        heading.textContent =
          `Results for "${query}"`;

      }


      if (!unique.length && page === 1) {

        results.innerHTML = `
          <div class="message">
            No movies or TV shows found.
          </div>
        `;

        loadMore.style.display =
          "none";

        return;

      }


      results.insertAdjacentHTML(
        "beforeend",
        unique.map(card).join("")
      );


      currentPage =
        page;


      totalPages =
        Math.max(
          movieData.total_pages || 1,
          tvData.total_pages || 1
        );


      loadMore.style.display =
        currentPage < totalPages
          ? "block"
          : "none";


    } catch (error) {

      console.error(error);


      if (page === 1) {

        results.innerHTML = `
          <div class="message">
            Unable to search right now.
          </div>
        `;

      }

      loadMore.style.display =
        "none";

    }

  }


  function openItem(id, type) {

    location.href =
      `/movie.html?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}`;

  }


  button.onclick = () => {

    currentPage = 1;

    search(1);

  };


  input.addEventListener(
    "keydown",
    (event) => {

      if (event.key === "Enter") {

        currentPage = 1;

        search(1);

      }

    }
  );


  loadMore.onclick = () => {

    if (
      currentPage < totalPages
    ) {

      search(
        currentPage + 1
      );

    }

  };


  const params =
    new URLSearchParams(
      location.search
    );


  const initialQuery =
    params.get("q");


  if (initialQuery) {

    input.value =
      initialQuery;

    search(1);

  }

</script>

</body>
</html>
