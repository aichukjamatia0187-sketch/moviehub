<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050504">
  <title>Free Classics — MovieHub</title>
  <style>
    :root{--bg:#050504;--card:#151513;--line:#292820;--gold:#d4a84f;--muted:#8a857a;
      --serif:'Playfair Display',Georgia,serif;--mono:ui-monospace,Menlo,Consolas,monospace}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:#f2efe8;font-family:Arial,Helvetica,sans-serif}
    .top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
      border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,5,4,.95);z-index:5}
    .brand{font:600 20px var(--serif);color:#f2efe8;text-decoration:none}
    .brand b{color:var(--gold)}
    .back{font:11px var(--mono);letter-spacing:.14em;color:var(--muted);text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
    h1{font:600 30px var(--serif);margin:0 0 6px}
    .kicker{font:10px var(--mono);letter-spacing:.2em;color:var(--gold);margin-bottom:8px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
    input{width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);
      border-radius:4px;color:#fff;font-size:14px;margin-bottom:20px;outline:none}
    input:focus{border-color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
    .card{text-decoration:none;color:inherit;display:block}
    .poster{aspect-ratio:2/3;position:relative;overflow:hidden;border:1px solid var(--line);
      border-radius:4px;background:var(--card)}
    .poster img{width:100%;height:100%;object-fit:cover;display:block}
    .badge{position:absolute;top:8px;left:8px;background:rgba(5,5,4,.75);border:1px solid #514b3e;
      border-radius:2px;padding:3px 6px;font:500 8px var(--mono);letter-spacing:.16em}
    .info{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
    .t{font:600 13px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .y{font:10px var(--mono);color:#777269;padding-top:2px}
    .player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);
      border-radius:4px;overflow:hidden}
    .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .desc{color:#bdb8ab;font-size:14px;line-height:1.7;margin-top:16px;max-height:220px;overflow:auto}
    .note{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:4px;
      font-size:12px;color:var(--muted);line-height:1.6}
    .note a{color:var(--gold)}
    .msg{padding:40px 0;text-align:center;color:var(--muted);font:12px var(--mono)}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">MOVIE<b>HUB</b></a>
    <a class="back" id="back" href="/">← HOME</a>
  </header>

  <main class="wrap" id="app"><div class="msg">LOADING...</div></main>

<script>
(function () {
  const app = document.getElementById('app');
  const qs = new URLSearchParams(location.search);
  const id = qs.get('id');
  const yt = qs.get('yt');

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));

  const strip = (h) => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent || ''; };

  async function getJSON(u) {
    const r = await fetch(u);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  /* ---------- PLAYER ---------- */
  async function showPlayer() {
    document.getElementById('back').href = '/free.html';
    document.getElementById('back').textContent = '← ALL FREE MOVIES';

    let meta = { title: 'Free Movie', year: '', description: '' };
    try { meta = await getJSON('/api/free/item/' + encodeURIComponent(id)); } catch (e) {}

    document.title = (meta.title || 'Free Movie') + ' — MovieHub';

    app.innerHTML = `
      <div class="kicker">FREE TO WATCH</div>
      <h1>${esc(meta.title || 'Free Movie')} ${meta.year ? '<span style="color:#777269;font-size:18px">(' + esc(String(meta.year).slice(0,4)) + ')</span>' : ''}</h1>
      <div class="sub">Public domain classic, streamed from the Internet Archive.</div>
      <div class="player">
        <iframe src="https://archive.org/embed/${encodeURIComponent(id)}"
          allowfullscreen webkitallowfullscreen mozallowfullscreen
          allow="autoplay; fullscreen; picture-in-picture"
          loading="lazy" title="${esc(meta.title || 'Movie')}"></iframe>
      </div>
      ${meta.description ? '<div class="desc">' + esc(strip(meta.description)) + '</div>' : ''}
      <div class="note">
        Source: <a href="https://archive.org/details/${encodeURIComponent(id)}" target="_blank" rel="noopener">archive.org/details/${esc(id)}</a>.
        Copyright rules differ by country, so availability may vary where you live.
      </div>`;
  }

  /* ---------- YOUTUBE PLAYER ---------- */
  function showYouTube() {
    document.getElementById('back').href = '/free.html';
    document.getElementById('back').textContent = '← ALL FREE MOVIES';
    if (!/^[\w-]{6,20}$/.test(yt)) { app.innerHTML = '<div class="msg">Invalid video</div>'; return; }

    const title = qs.get('t') || 'Free Movie';
    const ch = qs.get('ch') || '';
    document.title = title + ' — MovieHub';

    app.innerHTML = `
      <div class="kicker">FREE ON YOUTUBE</div>
      <h1 style="font-size:22px">${esc(title)}</h1>
      <div class="sub">${ch ? 'Official upload by ' + esc(ch) + '. ' : ''}Played through the YouTube player.</div>
      <div class="player">
        <iframe src="https://www.youtube.com/embed/${encodeURIComponent(yt)}?rel=0"
          allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin" title="${esc(title)}"></iframe>
      </div>
      <div class="note">
        If the video says it is unavailable, the owner has disabled embedding.
        <a href="https://www.youtube.com/watch?v=${encodeURIComponent(yt)}" target="_blank" rel="noopener">Watch it on YouTube</a>.
      </div>`;
  }

  /* ---------- LIST ---------- */
  async function showList() {
    app.innerHTML = '<div class="msg">LOADING...</div>';
    let list = [];
    let ytList = [];
    const [a, b] = await Promise.allSettled([getJSON('/api/free/list'), getJSON('/api/free/youtube')]);
    if (a.status === 'fulfilled') list = a.value.results || [];
    if (b.status === 'fulfilled') ytList = b.value.results || [];

    if (!list.length && !ytList.length) {
      app.innerHTML = '<div class="msg">Free movies could not be loaded right now. Please try again later.</div>';
      return;
    }

    app.innerHTML = `
      <div class="kicker">FREE TO WATCH</div>
      <h1>🎞️ Free Classics</h1>
      <div class="sub">Public domain feature films, free to watch right here.</div>
      <input id="q" type="search" placeholder="Search free movies...">
      <div class="grid" id="grid"></div>
      <h1 id="ytHead" style="margin-top:36px;font-size:24px">📺 Free on YouTube</h1>
      <div class="sub" id="ytSub">Full movies uploaded by official channels.</div>
      <div class="grid" id="ytGrid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))"></div>`;

    const grid = document.getElementById('grid');
    const render = (items) => {
      grid.innerHTML = items.map((m) => `
        <a class="card" href="/free.html?id=${encodeURIComponent(m.id)}">
          <div class="poster">
            <img loading="lazy" src="https://archive.org/services/img/${encodeURIComponent(m.id)}" alt="${esc(m.title)}">
            <span class="badge">FREE</span>
          </div>
          <div class="info">
            <span class="t">${esc(m.title)}</span>
            <span class="y">${esc(String(m.year || '').slice(0, 4))}</span>
          </div>
        </a>`).join('') || '<div class="msg">No movies found</div>';
    };
    const ytGrid = document.getElementById('ytGrid');
    const renderYT = (items) => {
      document.getElementById('ytHead').style.display = ytList.length ? '' : 'none';
      document.getElementById('ytSub').style.display = ytList.length ? '' : 'none';
      ytGrid.innerHTML = items.map((m) => `
        <a class="card" href="/free.html?yt=${encodeURIComponent(m.id)}&t=${encodeURIComponent(m.title)}&ch=${encodeURIComponent(m.channel)}">
          <div class="poster" style="aspect-ratio:16/9">
            <img loading="lazy" src="https://i.ytimg.com/vi/${encodeURIComponent(m.id)}/hqdefault.jpg" alt="${esc(m.title)}">
            <span class="badge">FREE</span>
          </div>
          <div class="info"><span class="t">${esc(m.title)}</span></div>
          <div class="y">${esc(m.channel)}</div>
        </a>`).join('');
    };

    render(list);
    renderYT(ytList);

    document.getElementById('q').addEventListener('input', (e) => {
      const v = e.target.value.trim().toLowerCase();
      render(v ? list.filter((m) => m.title.toLowerCase().includes(v)) : list);
      renderYT(v ? ytList.filter((m) => m.title.toLowerCase().includes(v)) : ytList);
    });
  }

  yt ? showYouTube() : id ? showPlayer() : showList();
})();
</script>
</body>
</html>
