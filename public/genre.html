<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Genre — MovieHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #08090d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      padding: 22px 24px 70px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 55px;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
    }

    .back {
      color: #9da1ad;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #fff;
    }

    .eyebrow {
      color: #777d8b;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 64px);
      letter-spacing: -2px;
      line-height: 1;
    }

    .subtitle {
      color: #858b99;
      margin: 15px 0 45px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 24px 14px;
    }

    .card {
      cursor: pointer;
      min-width: 0;
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      border-radius: 5px;
      background: #151820;
      transition: transform .2s ease, opacity .2s ease;
    }

    .card:hover .poster {
      transform: translateY(-4px);
      opacity: .9;
    }

    .title {
      margin-top: 9px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 5px;
      color: #777d8b;
      font-size: 11px;
    }

    .rating {
      color: #c9a85d;
      margin-left: 7px;
    }

    .loading,
    .empty {
      min-height: 300px;
      display: grid;
      place-items: center;
      color: #777d8b;
      font-size: 13px;
    }

    .load-more {
      display: block;
      margin: 50px auto 0;
      padding: 13px 24px;
      background: transparent;
      color: #ddd;
      border: 1px solid #30323a;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .load-more:hover {
      border-color: #777;
    }

    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px 10px;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 14px 60px;
      }

      .topbar {
        margin-bottom: 45px;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px 9px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        margin-bottom: 30px;
      }

      .title {
        font-size: 12px;
      }

      .meta {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="page">
  <div class="container">

    <header class="topbar">
      <a class="logo" href="/">MovieHub</a>
      <a class="back" href="/">← Back</a>
    </header>

    <section>
      <div class="eyebrow">Browse by genre</div>

      <h1 id="genreTitle">Genre</h1>

      <p class="subtitle" id="subtitle">
        Discover movies in this genre.
      </p>
    </section>

    <div id="movieGrid" class="grid">
      <div class="loading">Loading movies...</div>
    </div>

    <button id="loadMore" class="load-more" style="display:none">
      LOAD MORE
    </button>

  </div>
</div>

<script>
  const IMG = "https://image.tmdb.org/t/p/";

  const params = new URLSearchParams(location.search);

  const genreId = params.get("id");
  const genreName = params.get("name") || "Genre";

  let currentPage = 1;
  let totalPages = 1;

  const grid = document.getElementById("movieGrid");
  const title = document.getElementById("genreTitle");
  const subtitle = document.getElementById("subtitle");
  const loadMore = document.getElementById("loadMore");

  title.textContent = genreName;

  subtitle.textContent =
    `Explore ${genreName.toLowerCase()} movies on MovieHub.`;

  document.title = `${genreName} Movies — MovieHub`;

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function poster(path) {
    return path
      ? IMG + "w500" + path
      : "";
  }

  function year(date) {
    return date
      ? date.slice(0, 4)
      : "—";
  }

  function movieCard(movie) {
    const title =
      movie.title ||
      "Untitled";

    return `
      <article
        class="card"
        onclick="openMovie(${movie.id})"
      >

        ${
          movie.poster_path
            ? `
              <img
                class="poster"
                src="${poster(movie.poster_path)}"
                alt="${esc(title)}"
                loading="lazy"
              >
            `
            : `
              <div class="poster"></div>
            `
        }

        <div class="title">
          ${esc(title)}
        </div>

        <div class="meta">
          ${year(movie.release_date)}

          ${
            movie.vote_average
              ? `
                <span class="rating">
                  ★ ${Number(movie.vote_average).toFixed(1)}
                </span>
              `
              : ""
          }
        </div>

      </article>
    `;
  }

  async function loadMovies(page = 1) {

    if (!genreId) {
      grid.innerHTML =
        `<div class="empty">Genre not found.</div>`;
      return;
    }

    try {

      if (page === 1) {
        grid.innerHTML =
          `<div class="loading">Loading movies...</div>`;
      }

      const response = await fetch(
        `/api/discover/movie?with_genres=${encodeURIComponent(genreId)}&page=${page}&sort_by=popularity.desc`
      );

      if (!response.ok) {
        throw new Error("Unable to load movies.");
      }

      const data = await response.json();

      const movies =
        (data.results || [])
          .filter(movie => movie.poster_path);

      totalPages =
        data.total_pages || 1;

      if (page === 1) {
        grid.innerHTML = "";
      }

      if (!movies.length && page === 1) {
        grid.innerHTML =
          `<div class="empty">No movies found.</div>`;
        loadMore.style.display = "none";
        return;
      }

      grid.insertAdjacentHTML(
        "beforeend",
        movies.map(movieCard).join("")
      );

      currentPage = page;

      loadMore.style.display =
        currentPage < totalPages
          ? "block"
          : "none";

    } catch (error) {

      console.error(error);

      if (page === 1) {
        grid.innerHTML =
          `<div class="empty">Unable to load movies.</div>`;
      }

      loadMore.style.display = "none";
    }
  }

  function openMovie(id) {
    location.href =
      `/movie.html?id=${encodeURIComponent(id)}&type=movie`;
  }

  loadMore.onclick = () => {
    if (currentPage < totalPages) {
      loadMovies(currentPage + 1);
    }
  };

  loadMovies();
</script>

</body>
</html>
